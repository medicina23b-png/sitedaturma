# Worker da Cloudflare que envia as notificações push e os e-mails de lembrete.
# Publicar: dentro desta pasta, "npx wrangler deploy" (ver README.md).
name = "push-23b"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# A cada 5 minutos: lembretes de 2h antes + push pendente (rede de segurança).
[triggers]
crons = ["*/5 * * * *"]

# O Worker chama a si mesmo quando há muitos aparelhos pra avisar de uma vez
# (o plano grátis limita 50 chamadas externas por execução).
[[services]]
binding = "SELF"
service = "push-23b"

[vars]
FIREBASE_PROJECT_ID = "cronograma-23b"
APP_URL = "https://medicina23b-png.github.io/sitedaturma/"
TZ_OFFSET = "-03:00"          # Santarém/PA (sem horário de verão)
LEMBRETE_MINUTOS = "120"      # lembrete 2h antes
MAIL_FROM_NAME = "Medicina 23B"
# MAIL_FROM_EMAIL = "seu-email@gmail.com"   # remetente verificado no Brevo (ou configure como segredo)

# Segredos (NUNCA aqui no arquivo — configure com "npx wrangler secret put NOME"):
#   FIREBASE_SERVICE_ACCOUNT  conteúdo inteiro do .json da conta de serviço do Firebase
#   BREVO_API_KEY             chave de API do Brevo (e-mails)
#   MAIL_FROM_EMAIL           e-mail remetente verificado no Brevo
