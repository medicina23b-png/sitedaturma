// Acha o evento/arquivo cujo rótulo (o texto mostrado no campo) bate
// exatamente com o que a pessoa digitou/escolheu do datalist.
// Subtipo do aviso — sempre no início do texto, em negrito, com "■" na
// frente (ex.: "■ AVISOS | ..."). Mesma lista do servidor (Code.gs).
const SUBTIPOS_MURAL = ['INFORMES', 'RELEMBRANDO', 'MUDANÇA DE SALA', 'MUDANÇA DE HORÁRIO', 'ENQUETE', 'PRAZOS', 'AVISOS', 'ARQUIVOS'];
let muCitEventos = [], muCitArquivos = [], muEhEnquete = false, muOpcoes = ['', ''], muMultipla = false, muSubtipo = '';

function muResetEstado() { muCitEventos = []; muCitArquivos = []; muEhEnquete = false; muOpcoes = ['', '']; muMultipla = false; muSubtipo = ''; }

// Lê da tela o que a pessoa já digitou (texto das opções, checkbox de
// múltipla escolha) antes de redesenhar o formulário — assim adicionar ou
// remover uma opção/citação nunca apaga o que já estava escrito.
function muCapturarEstadoDoDOM() {
  const inputsOpcao = document.querySelectorAll('[data-mu-opcao]');
  if (inputsOpcao.length) muOpcoes = [...inputsOpcao].map(el => el.value);
  const chkMultipla = $('#mu-multipla');
  if (chkMultipla) muMultipla = chkMultipla.checked;
  const selSubtipo = $('#mu-subtipo');
  if (selSubtipo) muSubtipo = selSubtipo.value;
}

// Eventos futuros primeiro (mais próximo primeiro); os que já passaram vão
// pro final, agrupados como "Outros eventos passados" — continuam podendo
// ser citados (às vezes faz sentido, ex.: corrigir algo sobre um evento que
// já aconteceu), só não atrapalham quem geralmente quer citar algo futuro.
function eventoOptionsAgrupadosHTML(excluidos) {
  const hojeISO = iso(new Date());
  const disponiveis = state.events.filter(e => !excluidos.some(x => x.id === e.id));
  const futuros = disponiveis.filter(e => e.data >= hojeISO).sort(cmpEv);
  const passados = disponiveis.filter(e => e.data < hojeISO).sort((a, b) => cmpEv(b, a));
  let h = futuros.map(e => `<option value="${esc(eventoLabel(e))}">`).join('');
  if (passados.length) h += `<optgroup label="Outros eventos passados">${passados.map(e => `<option value="${esc(eventoLabel(e))}">`).join('')}</optgroup>`;
  return h;
}

function muChipHTML(item, tipo, label) {

  if (!texto) errs.push(muEhEnquete ? 'Escreva a pergunta da enquete.' : 'Escreva o texto do aviso.');

    saveCache();
    closeModal();
    state.tab = 'mural';
    renderView();
    toast(muEhEnquete ? 'Enquete publicada.' : 'Aviso publicado.');
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    if (handleApiError(e)) return;
    errEl.textContent = e.message || 'Não foi possível publicar.'; errEl.hidden = false;

}

const votosEmAndamento = new Set(); // evita clique duplo/corrida virar "vota e desvota" sem querer
async function votarEnquete(avisoId, opcao) {
  const chave = avisoId + ':' + opcao;
  if (votosEmAndamento.has(chave)) return;
  const m = state.mural.find(x => x.id === avisoId);
  if (!m) return;
  votosEmAndamento.add(chave);
  // Aplica na tela IMEDIATAMENTE, antes de esperar o servidor responder — o
  // Apps Script de verdade pode levar alguns segundos por chamada, e sem
  // isso o clique parecia não fazer nada até essa resposta chegar.
  aplicarVotoLocal(m, opcao);
  saveCache();
  renderView();
  try {
    const r = await Backend.votarEnquete(state.session.usuario, avisoId, opcao);
    if (r.versionMural) state.versionMural = r.versionMural;
  } catch (e) {
    aplicarVotoLocal(m, opcao); // chamar de novo com a mesma opção desfaz (é um toggle)
    saveCache();
    renderView();
    if (!handleApiError(e)) toast(e.message || 'Não foi possível registrar o voto.', 'err');
  } finally {
    votosEmAndamento.delete(chave);
  }
}

// Aplica, no estado local, o mesmo efeito que o servidor acabou de aplicar
// (votar numa opção nova troca o voto anterior se for de escolha única;
// clicar de novo na mesma opção desmarca). Só usado logo depois de o
// servidor confirmar o voto — é só pra tela reagir na hora.
function aplicarVotoLocal(m, opcao) {
  const eu = state.session.usuario;
  const jaTinha = m.meuVoto.indexOf(opcao) >= 0;
  if (!m.votantes || m.votantes.length !== m.opcoes.length) m.votantes = m.opcoes.map(() => []);
  const tira = o => { m.votos[o] = Math.max(0, (m.votos[o] || 0) - 1); m.votantes[o] = (m.votantes[o] || []).filter(u => u !== eu); };
  const poe = o => { m.votos[o] = (m.votos[o] || 0) + 1; if (m.votantes[o].indexOf(eu) < 0) m.votantes[o].push(eu); };
  if (jaTinha) {
    tira(opcao);
    m.meuVoto = m.meuVoto.filter(o => o !== opcao);
  } else {
    if (m.multiplaEscolha !== 'Sim') { m.meuVoto.forEach(tira); m.meuVoto = []; }
    poe(opcao);
    m.meuVoto.push(opcao);
  }
}

async function submitDataForm(form) {
  const fd = new FormData(form);
  const item = { id: fd.get('id') || '', titulo: (fd.get('titulo') || '').trim(), data: fd.get('data') || '', categoria: fd.get('categoria'), observacoes: (fd.get('observacoes') || '').trim() };
  const errEl = $('#dt-err');
  const errs = [];
  if (!item.titulo) errs.push('Informe o título.');
  if (!item.data) errs.push('Escolha uma data.');
  if (errs.length) { errEl.textContent = errs.join(' '); errEl.hidden = false; return; }
  errEl.hidden = true;

  const btn = $('[data-action="submit-data-form"]');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    const r = await Backend.saveData(state.session.token, item);
    const i = state.datas.findIndex(x => x.id === r.item.id);
    if (i >= 0) state.datas[i] = r.item; else state.datas.push(r.item);
    state.datas.sort((a, b) => a.data.localeCompare(b.data));
    if (r.versionDatas) state.versionDatas = r.versionDatas;
    saveCache();
    closeModal();
    renderView();
    toast('Data salva.');
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    if (handleApiError(e)) return;
    errEl.textContent = e.message || 'Não foi possível salvar.'; errEl.hidden = false;
  }
}

async function removeData(id) {
  if (!(await confirmar('Excluir esta data importante?'))) return;
  try {
    const r = await Backend.deleteData(state.session.token, id);
    state.datas = state.datas.filter(x => x.id !== id);
    if (r.versionDatas) state.versionDatas = r.versionDatas;
    saveCache();
    renderView();
    toast('Data excluída.');
  } catch (e) {
    if (!handleApiError(e)) toast(e.message || 'Não foi possível excluir.', 'err');
  }
}

async function salvarNota(eventoId) {
  const el = $('#nota-texto');
  if (!el) return;
  const texto = el.value;
  const statusEl = $('#nota-status');
  if (statusEl) statusEl.textContent = 'Salvando…';
  try {
    await Backend.salvarNota(state.session.usuario, eventoId, texto);
    const i = state.notas.findIndex(n => n.eventoId === eventoId);
    if (texto.trim()) {
      if (i >= 0) state.notas[i].texto = texto; else state.notas.push({ id: eventoId, eventoId, texto });
    } else if (i >= 0) {
      state.notas.splice(i, 1);
    }
    saveCache();
    if (statusEl) statusEl.textContent = 'Salvo.';
    toast('Anotação salva.');
  } catch (e) {
    if (statusEl) statusEl.textContent = '';
    if (!handleApiError(e)) toast(e.message || 'Não foi possível salvar a anotação.', 'err');
  }
}

async function removeMural(id) {
  if (!(await confirmar('Excluir este aviso do mural?'))) return;
  try {
    const r = await Backend.deleteMural(state.session.token, id);
    state.mural = state.mural.filter(m => m.id !== id);
    if (r.versionMural) state.versionMural = r.versionMural;
    saveCache();
    renderView();
    toast('Aviso excluído.');
  } catch (e) {
    if (!handleApiError(e)) toast(e.message || 'Não foi possível excluir.', 'err');
  }
}

async function toggleFollow(id) {
  const on = !state.followed.has(id);
  if (on) state.followed.add(id); else state.followed.delete(id);
  state.pending++;
  saveCache();
  refreshUI();
  toast(on ? 'Evento adicionado aos Eventos Acompanhados.' : 'Você deixou de acompanhar este evento.');
  try {
    await Backend.follow(state.session.usuario, id, on);
  } catch (e) {
    if (on) state.followed.delete(id); else state.followed.add(id);
    saveCache();
    refreshUI();
    toast(e.message || 'Não foi possível salvar. Tente de novo.', 'err');
  } finally {
    state.pending--;
  }
}

async function toggleCancelado(id) {
  const e = state.events.find(x => x.id === id);
  if (!e) return;
  const novo = e.cancelado === 'Sim' ? 'Não' : 'Sim';
  try {
    const r = await Backend.saveEvent(state.session.token, Object.assign({}, e, { cancelado: novo }));
    const saved = norm(r.event);
    const i = state.events.findIndex(x => x.id === saved.id);
    if (i >= 0) state.events[i] = saved;
    state.version = r.version;
    saveCache();
    refreshUI();
    toast(novo === 'Sim' ? 'Evento marcado como cancelado.' : 'Cancelamento desfeito.');
  } catch (err) {
    if (!handleApiError(err)) toast(err.message || 'Não foi possível salvar.', 'err');
  }
}

  renderView();
}

    syncNotaFormFields();

  if (ev.target.closest('#lote-form')) {

  else if (f.id === 'event-form') { ev.preventDefault(); submitForm(f); }
  else if (f.id === 'notas-login-form') { ev.preventDefault(); entrarNotas(); }
  else if (f.id === 'nota-form') { ev.preventDefault(); submitNotaForm(f); }
  else if (f.id === 'discente-form') { ev.preventDefault(); submitDiscenteForm(f); }
});

document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && state.modal) closeModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', () => sync({ silent: false }));
window.addEventListener('storage', ev => { if (IS_DEMO && ev.key === 'cron.demo') sync(); });

/* =====================================================================
   INÍCIO
   ===================================================================== */
// Login persistente sem link pessoal: o Firebase Auth guarda a sessão no
// aparelho sozinho (IndexedDB), e aqui a gente só acelera a entrada usando
// a sessão já salva em cache (localStorage) — assim que o Auth SDK
// restaurar a sessão de verdade em segundo plano, as próximas chamadas ao
// Firestore já saem autenticadas normalmente, sem o usuário perceber nada.
// Se por algum motivo a sessão do Auth não existir mais (ex.: expirou ou
// foi limpa), a primeira sincronização volta erro de autenticação e
// handleApiError() já devolve pro login (ver sync()/logout()).
(function boot() {
  const s = store.get('cron.session');
  if (s && s.usuario) {
    state.session = s;
    loadCache();
    enterApp();
    sync({ force: true });
    iniciarNotificacoes();
  } else {
    renderLogin();
  }
})();

// Registra o Service Worker (sw.js) — é um dos requisitos do navegador pra
// oferecer "Instalar aplicativo" no Android/Chrome/Edge (ver
// beforeinstallprompt, mais acima). Sem HTTPS (ex.: abrindo o arquivo direto
// do computador) o navegador recusa o registro sozinho; nesse caso o site
// continua funcionando normalmente, só sem a opção de instalar.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* sem instalação, sem problema */ }); });
}
})();
</script>
