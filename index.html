<!-- =====================================================================
     FIREBASE — inicialização (módulo ES, carregado do CDN oficial)
     Site hospedado no Netlify (a partir do GitHub); os dados ficam no
     Firestore e a lógica de servidor roda em Cloud Functions — ver
     functions/index.js e firestore.rules no repositório.
     Isto roda num <script type="module"> separado (obrigatório para os
     imports funcionarem) e expõe tudo em window.Firebase, que o script
     principal mais abaixo usa (ver objeto "Remote"). ===================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAnalytics, isSupported as analyticsIsSupported } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut,
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, collection, collectionGroup, doc, getDoc, getDocs, setDoc, addDoc,
    updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, writeBatch,
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  // Sem Firebase Storage neste projeto (por escolha) — "Arquivos da Turma"
  // funciona só por link (Google Drive, Docs etc.), então não precisa do
  // SDK de Storage nem do produto Storage ativado no Console.
  // Sem Cloud Functions neste projeto (por escolha, pra não exigir o plano
  // Blaze/cartão de crédito) — login usa Firebase Authentication direto, e
  // toda a lógica de negócio roda no próprio navegador + regras do Firestore.

  // Config pública do projeto "turma23b" — não é segredo: a segurança do
  // Firebase vem das regras do Firestore e da validação nas Cloud
  // Functions, não de esconder esta configuração (ela viaja pro navegador
  // de qualquer jeito, em qualquer app Firebase).
  const firebaseConfig = {
    apiKey: "AIzaSyAdvBFxOKEFlhYHrdDhCkE1V1PJyAc0U64",
    authDomain: "cronograma-23b.firebaseapp.com",
    projectId: "cronograma-23b",
    storageBucket: "cronograma-23b.firebasestorage.app",
    messagingSenderId: "918600139865",
    appId: "1:918600139865:web:48741541fec570cec11d48",
    measurementId: "G-GLNTR74DV4",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  analyticsIsSupported().then(ok => { if (ok) getAnalytics(app); }).catch(() => {});

  window.Firebase = {
    app, auth, db,
    signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut,
    collection, collectionGroup, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
    query, where, orderBy, limit, onSnapshot, writeBatch,
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
:root{
  --bg:#ffffff;
  --soft:#f6f7f9;
  --line:#e7e9ee;
  --line-2:#d6dae2;
  --ink:#16181d;
  --ink-2:#565e6c;
  --ink-3:#8a92a1;
  --accent:#2547d0;
  --accent-soft:#eef1fc;
  --danger:#c62f2f;
  --surface:#fff;
  --surface-2:#fbfbfd;
  --ink-solid:#16181d;
  --topbar-bg:rgba(255,255,255,.94);
  /* Texto em cima da cor da disciplina (cards da semana): no claro, segue o
     texto normal do site. No escuro isso é sobrescrito para ficar sempre
     escuro, já que o fundo colorido do card continua claro nos dois temas. */
  --ev-ink:var(--ink);
  --ev-ink-2:var(--ink-2);
  --ev-ink-3:var(--ink-3);
  /* Usadas só no painel do Coordenador da Tutoria (quem fala agora/sugestão/
     badges de "falou mais/menos"). */
  --amber-bg:#fff3cd; --amber-ink:#664d03; --amber-line:#ffe28a;
  --emerald-bg:#d1e7dd; --emerald-ink:#0f5132; --emerald-line:#9fd8bd;
  --rose-bg:#f8d7da; --rose-ink:#842029; --rose-line:#efadb3;
}
:root[data-theme="dark"]{
  --bg:#14161b;
  --soft:#1b1e25;
  --line:#2a2e37;
  --line-2:#3a3f4b;
  --ink:#eef0f4;
  --ink-2:#a7aebb;
  --ink-3:#767d8a;
  --accent:#6688ff;
  --accent-soft:#1c2542;
  --danger:#ff6b6b;
  --surface:#1b1e25;
  --surface-2:#20232b;
  --topbar-bg:rgba(20,22,27,.88);
  /* fixo (não usa var(--ink)): o fundo dos cards da semana continua claro
     de propósito nos dois temas, então o texto ali precisa continuar escuro */
  --ev-ink:#16181d;
  --ev-ink-2:#4a5160;
  --ev-ink-3:#6b7280;
  --amber-bg:#3a2f10; --amber-ink:#ffd873; --amber-line:#5c4a18;
  --emerald-bg:#123526; --emerald-ink:#7fe2b6; --emerald-line:#1d5a40;
  --rose-bg:#3a1f1f; --rose-ink:#ff8a8a; --rose-line:#5c2a2a;
}
:root[data-theme="dark"] .btn.primary:hover{background:#3a5ae0}
:root[data-theme="dark"] .btn.danger{border-color:#5a2a2a}
:root[data-theme="dark"] .btn.danger:hover{background:#2a1a1a}
:root[data-theme="dark"] .chip-cancelada{background:#3a1f1f;color:#ff8a8a}
:root[data-theme="dark"] .input:focus,:root[data-theme="dark"] .select:focus,:root[data-theme="dark"] .textarea:focus{box-shadow:0 0 0 3px rgba(102,136,255,.18)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins','Montserrat','Raleway',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--ink-2)}

/* Cor por categoria (disciplina, ou eixo dentro de Habilidades Profissionais):
   --c e --cb vêm de um estilo inline por evento (função catStyle), não mais
   de uma classe fixa — assim qualquer quantidade de cores funciona igual. */

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1c39a8}
.btn.danger{color:var(--danger);border-color:#efc8c8}
.btn.danger:hover{background:#fdf1f1}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink-2)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn.line{border-color:var(--line-2)}

.notif-btn{position:relative}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.notif-list{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto;margin:0 -4px}
.notif-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid transparent;border-radius:10px;padding:10px 12px;background:none;cursor:pointer}
.notif-item:hover{background:var(--soft)}
.notif-item.is-unread{background:var(--soft);border-color:var(--line-2)}
.notif-item.is-unread::before{content:'';width:7px;height:7px;border-radius:999px;background:var(--accent);flex:none;margin-top:6px}
.notif-item:not(.is-unread)::before{content:'';width:7px;flex:none}
.notif-ic{flex:none;width:28px;height:28px;display:inline-grid;place-items:center;border-radius:8px;background:var(--soft);color:var(--ink-2)}
.notif-body{min-width:0;line-height:1.4}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label{font-size:13px;font-weight:500;color:var(--ink-2)}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,71,208,.12)}
.textarea{resize:vertical;min-height:76px;line-height:1.5}
.hint{font-size:12px;color:var(--ink-3)}
.row{display:grid;gap:14px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1.3fr 1fr 1fr}
.form-err{color:var(--danger);font-size:13px;margin:0 0 12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.quick button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:500;color:var(--ink-2)}
.quick button:hover{background:var(--soft)}

.seg{display:inline-flex;padding:3px;background:var(--soft);border-radius:9px;border:1px solid var(--line)}
.seg.full{display:flex;width:100%;margin:22px 0 18px}
.seg button{flex:1;border:0;background:none;padding:6px 16px;border-radius:7px;font-weight:500;color:var(--ink-2)}
.seg button.is-active{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(22,24,29,.06)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--cb);color:var(--c);white-space:nowrap}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:392px}
.login h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:26px 0 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink-solid);color:#fff;display:grid;place-items:center}
.demo-note{margin-top:22px;padding:12px 14px;border-radius:8px;background:var(--soft);font-size:12.5px;color:var(--ink-2)}
.demo-note code{font-family:inherit;font-weight:600;color:var(--ink)}

/* ---------- topo ---------- */
.demo-banner{background:var(--soft);border-bottom:1px solid var(--line);text-align:center;font-size:12.5px;color:var(--ink-2);padding:6px 16px}
.demo-banner code{font-family:inherit;font-weight:600;color:var(--ink)}
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1360px;margin:0 auto;padding:0 24px;min-height:62px;display:flex;align-items:center;gap:28px}
.tabs{display:flex;align-self:stretch;gap:2px}
.tab{position:relative;border:0;background:none;padding:0 14px;color:var(--ink-2);font-weight:500}
.tab:hover{color:var(--ink)}
.tab.is-active{color:var(--ink)}
.tab.is-active::after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.spacer{flex:1}
/* status de sincronização: só uma bolinha discreta no canto inferior direito
   (verde = ok, amarela = sincronizando, vermelha = sem conexão). Clicar nela
   sincroniza na hora; passar o mouse mostra a hora da última sincronização. */
.sync-dot{position:fixed;right:8px;bottom:8px;z-index:15;width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;padding:0;opacity:.5;transition:opacity .15s}
.sync-dot:hover{opacity:1}
.sync-dot i{display:block;width:9px;height:9px;border-radius:50%;background:#2fb872}
.sync-dot.is-syncing i{background:#e6a23c;animation:pulse 1s ease-in-out infinite}
.sync-dot.is-error i{background:#d64545}
.sync-dot.is-local i{background:var(--ink-3)}
.who{display:flex;align-items:center;gap:10px;font-weight:500}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.who small{display:block;color:var(--ink-3);font-weight:400;font-size:12px;line-height:1.2}

/* ---------- página ---------- */
.page{max-width:1360px;margin:0 auto;padding:26px 24px 64px}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.nav{display:flex;align-items:center;gap:8px}
.range{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 10px 0 6px}
.lead{color:var(--ink-2);margin:-6px 0 22px;max-width:60ch}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.lg{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.lg:hover{background:var(--soft)}
.lg i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lg.is-off{opacity:.5}
.lg.is-off span{text-decoration:line-through}

/* ---------- grade semanal ---------- */
.wk{display:grid;grid-template-columns:104px repeat(var(--cols),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wk>*{background:var(--surface)}
.wk-head{padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.wk-head .wd{font-size:13px;color:var(--ink-3);font-weight:500}
.wk-head .dn{font-size:19px;font-weight:600;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.wk-head.is-today .dn{background:var(--accent);color:#fff}
.wk-head.is-today .wd{color:var(--accent)}
.wk>.wk-period{background:var(--soft);padding:14px 14px;display:flex;flex-direction:column;gap:3px;font-weight:500;color:var(--ink)}
.wk-period .ic{color:var(--ink-3);margin-bottom:2px}
.wk-period small{font-size:12px;color:var(--ink-3);font-weight:400}
.wk-cell{position:relative;min-height:132px;padding:8px;display:flex;flex-direction:column;gap:6px}
.wk>.wk-cell.is-today{background:var(--surface-2)}

.ev{position:relative;width:100%;text-align:left;display:flex;flex-direction:column;gap:1px;padding:8px 10px 8px 13px;border:0;border-radius:6px;background:var(--cb);box-shadow:inset 3px 0 0 var(--c);transition:box-shadow .15s}
.ev:hover{box-shadow:inset 3px 0 0 var(--c),0 3px 12px rgba(22,24,29,.12)}
.ev-time{font-size:12px;font-weight:600;color:var(--c)}
.ev-title{font-size:13px;font-weight:600;line-height:1.3;color:var(--ev-ink);overflow-wrap:anywhere}
.ev-meta{font-size:12px;color:var(--ev-ink-2);line-height:1.35}
.ev-detail{display:none;font-size:12px;color:var(--ev-ink-2);margin-top:3px;line-height:1.4}
.ev-detail span{display:block}
.ev-detail .ic{margin-right:4px;color:var(--ev-ink-3)}
.detailed .ev-detail{display:block}
.ev-star{position:absolute;top:8px;right:8px;color:var(--c)}
.ev.has-mine{padding-bottom:30px}
.ev-mine{position:absolute;bottom:6px;right:7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;line-height:0;color:var(--c);background:#fff;box-shadow:0 0 0 1.5px var(--c),0 1px 4px rgba(22,24,29,.2)}
.minha-vaga .ic{flex:none}
.minha-vaga{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500}
.lg-mine{display:inline-flex;align-items:center;gap:6px;padding:5px 4px;font-size:12.5px;color:var(--ink-3)}
.lg-mine .ic{color:var(--accent)}
.ev.has-star .ev-time{padding-right:18px}
.ev.is-cancelada{opacity:.72}
.ev.is-cancelada .ev-title{text-decoration:line-through;text-decoration-color:#d64545}
.ev-cancel-badge{display:inline-flex;align-items:center;gap:2px;margin-top:4px;font-size:10.5px;font-weight:600;color:#d64545}
.ev-cancel-badge .ic{width:11px;height:11px}
.chip-cancelada{background:#fdecec;color:#c62f2f}
.ev-row{display:flex;align-items:flex-start;gap:6px;width:100%}
.ev-col{flex:1 1 0;min-width:0}

.add-cell{margin-top:auto;height:28px;border:1px dashed transparent;background:none;border-radius:6px;color:var(--ink-3);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.wk-cell:hover .add-cell,.add-cell:focus-visible{opacity:1;border-color:var(--line-2)}
.add-cell:hover{background:var(--soft);color:var(--ink)}
@media (hover:none){.add-cell{opacity:1;border-color:var(--line)}}

/* lista por dia (celular) */
.dl{display:none;flex-direction:column;gap:12px}
/* visão "Hoje": um card de dia sozinho, sempre visível (não entra no
   toggle de .wk/.dl por tamanho de tela — é a mesma visão em qualquer
   largura) e com um teto de largura pra não esticar demais em telas grandes */
.dl-solo{display:flex;flex-direction:column;gap:12px;max-width:640px}
.dl-day{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.dl-day.is-today{border-color:var(--accent)}
.dl-head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;background:var(--soft);font-weight:500}
.dl-head small{color:var(--ink-3);font-weight:400;margin-left:6px}
.dl-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.dl-plabel{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-3);margin-bottom:6px}
.dl .stack{display:flex;flex-direction:column;gap:6px}
.dl-empty{color:var(--ink-3);font-size:13px}

/* ---------- visão mensal ---------- */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mo>*{background:var(--surface)}
.mo-wd{padding:10px;text-align:center;font-size:13px;color:var(--ink-3);font-weight:500}
.mo-cell{min-height:134px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mo-cell:hover{background:var(--surface-2)}
.mo>.mo-cell.is-other{background:var(--surface-2)}
.mo-cell.is-other .mo-num{color:var(--ink-3)}
.mo-num{font-weight:600;font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
.mo-cell.is-today .mo-num{background:var(--accent);color:#fff}
.mo-plabel{font-size:11px;color:var(--ink-3);margin-top:3px}
.mini{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:2px 4px;border-radius:5px;font-size:12px;line-height:1.35}
.mini:hover{background:var(--soft)}
.mini i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}
.mini b{font-weight:600;color:var(--ink-2);flex:none}
.mini span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mini-mine{overflow:visible;flex:none;display:inline-flex;align-self:center;color:var(--c)}
.mo-more{font-size:12px;color:var(--accent);font-weight:500;padding:0 4px}
.mo-dots{display:none;gap:3px;flex-wrap:wrap}
.mo-dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* ---------- estados vazios ---------- */
.empty{border:1px dashed var(--line-2);border-radius:12px;padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{color:var(--ink-3);margin-bottom:6px}
.empty h3{font-size:16px;font-weight:600}
.empty p{color:var(--ink-2);max-width:46ch}
.empty .btn{margin-top:10px}
.summary{color:var(--ink-2);margin:0 0 14px}

/* ---------- histórico ---------- */
.hist-month{font-size:15px;font-weight:600;margin:26px 0 10px}
.hist-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist-row{display:grid;grid-template-columns:190px 1fr auto auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:0}
.hist-week b{display:block;font-weight:600}
.hist-week span{font-size:12.5px;color:var(--ink-3)}
.hist-chips{display:flex;gap:6px;flex-wrap:wrap}
.hist-count{color:var(--ink-2);font-size:13px;white-space:nowrap}
.hist-actions{display:flex;gap:6px}
.now-tag{font-size:12px;color:var(--accent);font-weight:500;margin-left:8px}

/* ---------- segmentado com rádio (arquivos) ---------- */
.seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 16px;border-radius:7px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg input[type=radio]{position:absolute;opacity:0;width:0;height:0}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(22,24,29,.06)}

/* ---------- arquivos da turma ---------- */
.arq-group{margin-bottom:28px}
.arq-group-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:10px}
.arq-group-title .dot{width:10px;height:10px;border-radius:50%;background:var(--cb);box-shadow:inset 0 0 0 2px var(--c)}
.arq-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arq-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.arq-mover{display:flex;flex-direction:column;flex:none;margin-right:-6px}
.icon-btn.xs{width:22px;height:18px;border-radius:4px}
.icon-btn.xs:disabled{opacity:.25;cursor:default}
.icon-btn.xs:not(:disabled):hover{background:var(--soft)}
.arq-row:last-child{border-bottom:0}
.arq-tipo{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;flex:none;width:96px}
.arq-tipo .ic{color:var(--ink-3)}
.arq-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.arq-titulo{display:flex;align-items:center;gap:6px;font-weight:500;overflow-wrap:anywhere}
.arq-titulo .ic{color:#d64545;flex:none}
.arq-meta{font-size:12.5px;color:var(--ink-3)}
.arq-acoes{display:flex;align-items:center;gap:4px;flex:none}
@media (max-width:640px){
  .arq-row{flex-wrap:wrap}
  .arq-tipo{width:auto}
  .arq-acoes{width:100%;justify-content:flex-end}
}

/* ---------- mural de avisos ---------- */
.mural-list{display:flex;flex-direction:column;gap:12px}
.mural-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.mural-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mural-data{font-size:12px;color:var(--ink-3)}
.mural-texto{white-space:pre-wrap;overflow-wrap:anywhere}
.mural-subtipo{color:var(--accent)}
.mural-citas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mural-lido{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
.mural-lido summary{cursor:pointer;color:var(--ink-2);font-weight:500}
.mural-lido summary::-webkit-details-marker{color:var(--ink-3)}
.mural-lido p{margin-top:6px;overflow-wrap:anywhere}

/* citações múltiplas e opções da enquete, no formulário de publicar aviso */
.mu-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mu-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12.5px;max-width:100%}
.mu-chip button{display:inline-flex;color:var(--ink-3);border-radius:50%;padding:2px}
.mu-chip button:hover{background:var(--line);color:var(--ink)}
.mu-opcao-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mu-opcao-row .input{flex:1}

/* enquete: opções com barra de resultado embutida */
.enquete{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.enquete-opcao{position:relative;width:100%;text-align:left;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);overflow:hidden;padding:0}
.enquete-opcao:hover{border-color:var(--accent)}
.enquete-opcao.is-marcada{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.enquete-barra{position:absolute;top:0;left:0;bottom:0;background:var(--accent-soft);transition:width .25s ease-out;z-index:0}
.enquete-linha{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:9px 12px}
.enquete-check{width:14px;flex:none;color:var(--accent)}
.enquete-texto{flex:1;font-size:13.5px;overflow-wrap:anywhere}
.enquete-n{font-size:12.5px;color:var(--ink-2);font-weight:600;flex:none}

/* ---------- datas importantes ---------- */
.data-list{display:flex;flex-direction:column;gap:10px}
.data-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.data-item.hoje{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.data-dia{flex:none;width:52px;height:52px;border-radius:10px;background:var(--cb);box-shadow:inset 0 0 0 2px var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.data-num{font-size:18px;font-weight:700;color:var(--c)}
.data-mes{font-size:10.5px;text-transform:uppercase;color:var(--c);font-weight:600}
.data-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.data-titulo{font-weight:500;overflow-wrap:anywhere}
.data-obs{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.data-contagem{flex:none;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.data-item.breve .data-contagem{color:var(--accent)}
.data-item.hoje .data-contagem{color:var(--danger)}
.data-item.passou{opacity:.6}
.data-item.passou .data-contagem{color:var(--ink-3);font-weight:400}
.data-acoes{flex:none;display:flex;gap:2px}
.data-passadas{margin-top:16px;font-size:13px}
.data-passadas summary{cursor:pointer;color:var(--ink-2);font-weight:500}

/* ---------- busca única ---------- */
.confirm-backdrop{position:fixed;inset:0;z-index:90;background:rgba(22,24,29,.45);display:grid;place-items:center;padding:16px}
.confirm-box{width:100%;max-width:400px;background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 24px 70px rgba(22,24,29,.35);padding:22px;animation:rise .15s ease-out}
.confirm-box p{margin:0 0 18px;font-size:14.5px;line-height:1.5}
.confirm-acoes{display:flex;justify-content:flex-end;gap:8px}
.ajuda-box h3{font-size:15px;font-weight:600;margin:0 0 10px}
.ajuda-box p{font-size:13px;color:var(--ink-2);margin:0 0 10px;line-height:1.5}
.ajuda-box ul{margin:0 0 14px;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.6}
.ajuda-box li{margin-bottom:4px}
.ajuda-box kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;padding:1px 6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;font-size:11px}
.busca-grupo{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em;margin:16px 0 6px}
.busca-grupo:first-child{margin-top:4px}
.busca-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-radius:8px;text-decoration:none;color:var(--ink)}
.busca-item:hover{background:var(--soft)}
.busca-item .dot{width:9px;height:9px;border-radius:50%;background:var(--cb);box-shadow:inset 0 0 0 2px var(--c);flex:none}
.busca-item .ic{flex:none;color:var(--ink-3)}
.busca-texto{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- aniversariantes (mural) ---------- */
.aniversarios{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;background:var(--surface)}
.aniversarios-titulo{font-size:13px;font-weight:600;color:var(--ink-2)}
.aniversarios-lista{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px}
.aniversario-item{font-size:13px;color:var(--ink)}
.aniversario-item.is-hoje{padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.aniversario-item.is-hoje b{color:inherit}
@media (max-width:640px){
  .data-item{flex-wrap:wrap}
  .data-contagem{order:3;width:100%;padding-left:66px;margin-top:-6px}
}
.mural-cita{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--cb,var(--soft));color:var(--c,var(--ink-2));border:0;max-width:100%}
.mural-cita span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mural-cita.is-off{background:var(--soft);color:var(--ink-3)}
a.mural-cita{text-decoration:none}

/* ---------- Notas / Envio de Notas / Discentes ---------- */
.notas-gate{max-width:420px;margin:24px auto;border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface)}
.notas-gate h3{margin-top:4px}
.notas-gate-form{width:100%;text-align:left;margin-top:14px}
.nota-group{margin-bottom:28px}
.nota-group-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:10px}
.nota-group-title .dot{width:10px;height:10px;border-radius:50%;background:var(--cb);box-shadow:inset 0 0 0 2px var(--c)}
.nota-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.nota-card{border-radius:12px;background:var(--cb);box-shadow:inset 0 0 0 1px var(--c);padding:14px 16px;display:flex;flex-direction:column;gap:8px;color:var(--ev-ink)}
.nota-card-topo{display:flex;flex-direction:column;gap:4px}
.nota-card-topo .chip{align-self:flex-start;background:rgba(255,255,255,.55);color:var(--ev-ink-2)}
.nota-disc{font-size:12.5px;font-weight:600;color:var(--ev-ink-2)}
.nota-card-valor{font-size:26px;font-weight:600;line-height:1}
.nota-card-valor small{font-size:13px;font-weight:500;color:var(--ev-ink-3);margin-left:4px}
.nota-card .btn.ghost{align-self:flex-start;color:var(--ev-ink-2);border-color:rgba(0,0,0,.12)}
.disc-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.disc-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.disc-list .disc-row:last-child{border-bottom:0}
.disc-row-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.disc-row-main:hover .disc-nome{color:var(--accent)}
.disc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.disc-nome{font-weight:600;display:flex;align-items:center;gap:6px}
.disc-meta{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok-tag{color:var(--accent)}
.nota-row-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}
.nota-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--cb);box-shadow:inset 0 0 0 1px var(--c);color:var(--ev-ink)}
.nota-row .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.nota-row-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.nota-row-info .muted{color:var(--ev-ink-2)}
.lote-grid{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
.lote-row{display:flex;align-items:center;gap:10px;padding:4px 6px}
.lote-nome{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lote-input{width:92px;flex:none;text-align:center}
@media (max-width:640px){
  .nota-list{grid-template-columns:1fr 1fr}
  .disc-row{flex-wrap:wrap}
  .lote-input{width:76px}
}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(22,24,29,.4);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;animation:fade .15s ease-out}
.modal{width:100%;max-width:660px;background:var(--surface);border-radius:16px;box-shadow:0 24px 70px rgba(22,24,29,.28);padding:28px;animation:rise .18s ease-out}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.modal h2{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.3;margin:10px 0 0}
.modal-head h2{margin-top:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin:20px 0 6px}
.fact{display:flex;gap:10px;align-items:flex-start;min-width:0}
.fact .ic{color:var(--ink-3);margin-top:3px}
.fact dt{font-size:12.5px;color:var(--ink-3)}
.fact dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.sec h4{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.cal-quick{display:flex;flex-wrap:wrap;gap:8px}
.cal-quick .btn{text-decoration:none}
.sec p{overflow-wrap:anywhere}
.grp-name{font-weight:500;margin-bottom:10px}
.dis{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.dis-head{font-weight:600;margin-bottom:4px}
.dis-row{display:flex;gap:8px;font-size:13.5px;line-height:1.5;padding:1px 0}
.dis-row b{width:14px;flex:none;font-weight:600;color:var(--ink-3)}
.dis-details summary{cursor:pointer;color:var(--accent);font-weight:500;margin-bottom:10px}
.modal-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.modal-foot .spacer{flex:1}
.following{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;font-weight:500}

/* ---------- Encerrar Semestre / Histórico de semestres (aba Discentes) ---------- */
.sem-box{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.sem-box h4{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);margin:0}
.modal.semwizard,.modal.historico{max-width:720px}
.sem-grupo-head{display:grid;grid-template-columns:1fr 100px 150px;gap:10px;padding:0 2px 6px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3)}
#sem-grupos-lista{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.sem-grupo-row{display:grid;grid-template-columns:1fr 100px 150px;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.sem-grupo-row:last-child{border-bottom:0}
.sem-grupo-nome{font-size:13px}
.hist-sem-list{display:flex;flex-direction:column;gap:8px}
.hist-sem-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.hist-sem-item:hover{background:var(--surface-2)}
.hist-sem-item b{flex:none}
.hist-sem-item .muted{flex:1}
.modal.historico details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.modal.historico summary{cursor:pointer;font-size:13px}
@media (max-width:620px){
  .sem-grupo-head,.sem-grupo-row{grid-template-columns:1fr 76px 118px;gap:6px}
}

/* ---------- Coordenador da Tutoria (visual minimalista: sem cores fortes,
   só tons neutros + o azul de destaque que o resto do site já usa) ---------- */
.modal.coord kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;padding:1px 5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;font-size:10.5px}
.modal.coord{width:92vw;max-width:980px;height:82vh;padding:0;display:flex;flex-direction:column;overflow:hidden}
.coord-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.coord-top-l{display:flex;align-items:center;gap:8px;min-width:0}
.coord-top h2{margin:0;font-size:13.5px;font-weight:600;white-space:nowrap}
.coord-top .sub{color:var(--ink-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coord-top-r{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.coord-live{display:none;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px 4px 8px;font-size:11.5px;color:var(--ink-2)}
.coord-live.show{display:flex}
.coord-live .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
.coord-live b{font-family:ui-monospace,monospace;font-weight:600;color:var(--ink)}
.coord-body{flex:1;overflow:hidden;display:flex}
.coord-col{overflow-y:auto;padding:12px 14px}
.coord-col-obj{width:48%;border-right:1px solid var(--line)}
.coord-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.coord-col-head .t{font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3)}
.coord-col-head .acoes{display:flex;gap:4px}
.coord-col-part{width:52%;display:flex;flex-direction:column;padding:0}
.coord-part-inner{flex:1;overflow-y:auto;padding:12px 14px}
.coord-foot{flex:none;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coord-obj-node{border-radius:8px;padding:7px 9px;margin-bottom:3px;cursor:pointer;border:1px solid transparent;font-size:12.5px}
.coord-obj-node:hover{background:var(--surface-2)}
.coord-obj-node.active{border-color:var(--line-2);background:var(--accent-soft)}
.coord-obj-node.lvl1{margin-left:14px;font-size:12px;color:var(--ink-2)}
.coord-obj-row{display:flex;align-items:center;gap:7px}
.coord-obj-row .ic{flex:none;color:var(--ink-3)}
.coord-obj-node.active .coord-obj-row .ic{color:var(--accent)}
.coord-nav{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3)}
.coord-suggest{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12px;padding:0 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.coord-suggest .ic{flex:none;color:var(--ink-3)}
.coord-suggest b{color:var(--ink);font-weight:600}
.coord-stu{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;background:var(--surface);border-left:3px solid transparent}
.coord-stu.active{border-left-color:var(--accent);background:var(--accent-soft)}
.coord-stu-main{flex:1;min-width:0}
.coord-stu-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.coord-kbd{padding:1px 5px;font-size:9px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px}
.coord-stu-name{font-size:12px;font-weight:500}
.coord-stu-meta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.coord-stu-meta .time{font-family:ui-monospace,monospace;font-weight:600;color:var(--ink-2)}
.coord-stu-meta .ic{flex:none}
.coord-stu-btn{height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-size:11.5px;font-weight:500;cursor:pointer;flex:none}
.coord-stu-btn.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
:root[data-theme="dark"] .coord-stu-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.coord-obj-add{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;padding:10px}
.coord-sub-list{display:flex;flex-direction:column;gap:5px;margin-left:12px}
.coord-sub-row{display:flex;gap:5px;align-items:center}
@media (max-width:760px){
  .modal.coord{width:100vw;height:100vh;max-width:none;border-radius:0}
  .coord-body{flex-direction:column}
  .coord-col-obj,.coord-col-part{width:100%}
  .coord-col-obj{max-height:36%;border-right:none;border-bottom:1px solid var(--line)}
}

/* ---------- avisos ---------- */
.toast-root{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink-solid);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 8px 28px rgba(22,24,29,.25);animation:rise .2s ease-out}
.toast.err{background:var(--danger)}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsivo ---------- */
@media (max-width:900px){
  .topbar-in{flex-wrap:wrap;gap:8px 16px;padding:10px 16px 0}
  .tabs{order:3;width:100%;min-height:42px;overflow-x:auto}
  .page{padding:18px 16px 56px}
  .wk{display:none}
  .dl{display:flex}
  .hist-row{grid-template-columns:1fr auto}
  .hist-chips{grid-column:1/-1;order:3}
  .hist-count{display:none}
}
@media (max-width:640px){
  .mo-list{display:none}
  .mo-dots{display:flex}
  .mo-cell{min-height:62px;padding:6px 4px;align-items:center}
  .mo-more{display:none}
  .who span.who-name{display:none}
  .range{font-size:18px}
  .row.c2,.row.c3,.facts{grid-template-columns:1fr}
  .modal{padding:20px}
  .toolbar .spacer{display:none}
}

/* ---------- impressão ---------- */
.print-head{display:none}
.print-all-sheet{display:none}
.print-table{width:100%;border-collapse:collapse;font-size:9.5px;line-height:1.25}
.print-table th,.print-table td{border:1px solid #ccc;padding:.25em .7em;text-align:left;vertical-align:top}
.print-table th{background:#f2f2f2;font-weight:600}
.print-table td:first-child,.print-table th:first-child{white-space:nowrap}
/* muita coisa pra imprimir: divide em duas tabelas lado a lado (mesma formatação) */
.print-cols{display:flex;gap:6mm;align-items:flex-start}
.print-cols .print-table{flex:1;min-width:0}
/* "molde" invisível usado só pra medir a altura antes de imprimir */
.print-measure .wk{display:grid!important;border-radius:0}
.print-measure .wk-cell{min-height:90px}
.print-measure .ev-detail{display:block}
@page{size:A4 landscape;margin:7mm}
@media print{
  body{background:#fff;font-size:11px}
  .no-print,.topbar,.toolbar,.legend,.toast-root,.add-cell,.demo-banner,#modal-root,.summary{display:none!important}
  .page{padding:0;max-width:none}
  .print-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #16181d;padding-bottom:8px;margin-bottom:12px}
  .print-head h1{font-size:20px;font-weight:600}
  .print-head p{color:#565e6c;margin-top:2px}
  .wk{display:grid!important;border-radius:0;zoom:var(--print-zoom,1)}
  .dl{display:none!important}
  .wk-cell{min-height:90px}
  .ev{break-inside:avoid;transition:none}
  .ev-row{break-inside:avoid}
  .ev-detail{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* "Imprimir tudo": some a grade da semana atual e mostra só a tabela geral */
  body.print-all-mode .wk,body.print-all-mode .dl,body.print-all-mode .print-head{display:none!important}
  body.print-all-mode .print-all-sheet{display:block}
}

<script>
(() => {
'use strict';

/* =====================================================================

/* =====================================================================

   ===================================================================== */
// SUBGRUPOS, TUTORIAS e EIXOS (abaixo) começam com os valores padrão deste
// semestre, mas são "let" (não "const") de propósito: depois de "Encerrar

// pela sincronização normal — ver aplicarConfiguracao() mais abaixo. Sem

let SUBGRUPOS = {

}

let TUTORIAS = {
  T1: ['Arthur Severiano dos Santos Pontes', 'Clara Sofia da Silva Oliveira', 'Emilly Pinheiro da Cruz', 'Gabriella Cláudia Figueiredo Melo', 'João Lucas Moita de Sousa', 'Thiago Pinheiro da Silva', 'Vanderson Mello Tavares da Silva', 'Vitor Saymon Nascimento Ruberto'],
  T2: ['Alexandre Carvalho Leal Correa', 'Bianca Rafaela Farias da Silva', 'Cristhian Buzzi Camargo Cordeiro', 'Gabriel Parente Bernardes', 'Italo Kristiano de Andrade Silva Júnior', 'Luís Gustavo de Oliveira Costa', 'Norma Vitória da Silva Fialho', 'Silvano Carvalho da Costa Filho', 'Victor Fernando Xavier Laurindo da Silva'],
};

  { label: 'Subgrupos juntos', items: ['A&D', 'B&C'] },
  { label: 'Divisões dos subgrupos', items: ['A1', 'A2', 'B1', 'B2', 'C1', 'C2', 'D1', 'D2'] },
];
const DISC_TUTORIA = 'Tutoria';
const DISC_MORFO = 'Morfofuncional';
const DISC_HAB = 'Habilidades Profissionais';
const DISC_GIESC = 'Gestão, Integração, Ensino, Serviço e Comunidade';
const DISC_GIESC_ABBR = 'GIESC';
const DISCIPLINAS = [DISC_TUTORIA, DISC_MORFO, DISC_HAB, DISC_GIESC];
// Eixos de Habilidades Profissionais do semestre atual — também "let" (ver
// comentário de SUBGRUPOS acima). É isto que o assistente de "Encerrar
// Semestre" chama de "novas disciplinas": os temas que giram a cada
// semestre, diferente de Tutoria/Morfofuncional/HP/GIESC, que são fixos.
let EIXOS = ['Cardiologia', 'Pneumologia', 'Ginecologia', 'Obstetrícia', 'Endocrinologia', 'Terapêutica Médica'];

// Mesmas listas usadas no servidor (Code.gs) pra validar uma nota — precisam
// bater exatamente, senão o navegador aceita (ou recusa) algo diferente do
// que o servidor aceitaria.
const TIPOS_AVALIACAO = ['Somativa', 'Formativa', 'Completa'];
const NOTAS_MAXIMAS_VALIDAS = [10, 6, 5, 4];

// e mesmo nelas, não é pedido numa nota "Completa" (nota final da

const DISCIPLINAS_COM_MODULO = [DISC_TUTORIA, DISC_MORFO];
const rotuloTipoAvaliacao = t => t === 'Completa' ? 'Nota Completa da Disciplina' : (t === 'Formativa' ? 'Nota Formativa' : 'Nota Somativa');
const precisaModuloAvaliacao = (disciplina, tipo) => DISCIPLINAS_COM_MODULO.indexOf(disciplina) >= 0 && tipo !== 'Completa';

// Cor de cada categoria: as disciplinas fora de Habilidades têm cor própria;
// dentro de Habilidades, cada eixo tem a sua.
const DISC_CORES = {
  [DISC_TUTORIA]: '#fff699',
  [DISC_MORFO]: '#b6eea7',
  [DISC_GIESC]: '#e9ed98',
};
const EIXO_CORES = {
  Pneumologia: '#b7e7f3',
  Cardiologia: '#faada5',

// Chave de categoria de um evento: um eixo (dentro de Habilidades) ou a
// disciplina em si (fora de Habilidades).
const catKey = e => e.disciplina === DISC_HAB ? 'eixo:' + e.eixo : 'disc:' + e.disciplina;
const catColorOf = key => key.slice(0, 5) === 'eixo:' ? (EIXO_CORES[key.slice(5)] || '#d9d9d9') : (DISC_CORES[key.slice(5)] || '#d9d9d9');
// Escurece uma cor hex por um fator (0–1), para servir de "tinta" de
// contraste (borda, texto, ícone) sobre o fundo claro da própria cor.
function darken(hex, factor) {
  const h = String(hex).replace('#', '');
  const n = c => Math.max(0, Math.min(255, Math.round(parseInt(h.substr(c, 2), 16) * factor)));
  return '#' + [0, 2, 4].map(n).map(v => v.toString(16).padStart(2, '0')).join('');
}
const catStyle = key => { const bg = catColorOf(key); return `--c:${darken(bg, 0.5)};--cb:${bg}`; };

const DOCENTES_POR_DISCIPLINA = {

  [DISC_MORFO]: ['Juarez de Sousa', 'Christian Diniz de Lima', 'Antônio Quaresma da Silva', 'Daniel Berreta Moreira'],
  [DISC_HAB]: ['José Alexandre Neto', 'Carlos Alberto Sinimbú', 'Mariana Neves Leite', 'Hélio Cabral da Silva', 'Andrea Leal Novaes', 'Valter Pinheiro Sinimbú'],

// Sugestões de docente por EIXO de Habilidades Profissionais (opcional,

let DOCENTES_EIXOS = {};
function docentesFor(disc) {
  const curada = DOCENTES_POR_DISCIPLINA[disc] || [];
  const extrasEixo = disc === DISC_HAB ? Object.values(DOCENTES_EIXOS).flat() : [];

// Aplica a configuração do semestre atual (vinda do servidor, ou ainda
// local no modo demonstração) sobre as variáveis acima. Chamada sempre que

function aplicarConfiguracao(cfg) {
  if (!cfg || typeof cfg !== 'object') return;
  if (Array.isArray(cfg.eixos) && cfg.eixos.length) EIXOS = cfg.eixos;
  if (cfg.docentesEixos && typeof cfg.docentesEixos === 'object') DOCENTES_EIXOS = cfg.docentesEixos;

/* =====================================================================

const TIPOS_DOCUMENTO = ['Roteiro', 'Slide', 'Relatório', 'Site', 'Livro', 'Link de Livro'];
// Tipos que são sempre um link (nunca um arquivo enviado do computador)

// Mesma lógica do servidor (linkPdf_ em Code.gs): reconhece um link de

function linkPdfLocal(link) {
  const doc = String(link || '').match(/docs\.google\.com\/document\/d\/([\w-]+)/);
  if (doc) return 'https://docs.google.com/document/d/' + doc[1] + '/export?format=pdf';
  const slide = String(link || '').match(/docs\.google\.com\/presentation\/d\/([\w-]+)/);
  if (slide) return 'https://docs.google.com/presentation/d/' + slide[1] + '/export/pdf';
  const sheet = String(link || '').match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/);
  if (sheet) return 'https://docs.google.com/spreadsheets/d/' + sheet[1] + '/export?format=pdf';
  return '';
}
// Só usada no modo demonstração (sem Drive de verdade): calcula os mesmos
// três campos que o servidor calcularia (downloadUrl/pdfUrl/abrirUrl).
function enriquecerArquivoLocal(a) {
  if (a.origem === 'upload' && a.dataUrl) {
    a.downloadUrl = a.dataUrl;
    a.pdfUrl = a.mimeType === 'application/pdf' ? a.dataUrl : '';
    a.abrirUrl = a.dataUrl;
  } else {
    a.downloadUrl = '';
    a.pdfUrl = linkPdfLocal(a.link);
    a.abrirUrl = a.link || '';
  }
  return a;
}
// Os dois momentos de cada tutoria (campo "tutoriaTipo" na planilha)
const TUTORIA_MOMENTOS = ['Abertura', 'Fechamento'];
const MOMENTO_ANTIGO = { T1: 'Abertura', T2: 'Fechamento' }; // eventos salvos antes desta mudança

  { k: 'manha', nome: 'Manhã', hint: 'até 12h', icon: 'sun', def: ['08:00', '12:00'] },

];

const DIA_LARGO = 2; // 2 = quarta-feira
const DIA_LARGO_FR = 1.5; // 1 = mesma largura dos demais dias; 1.5 = 50% mais largo
const WD_LONG = ['segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado', 'domingo'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MES_ABR = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

const FIELDS = ['id', 'disciplina', 'tutoriaTipo', 'eixo', 'titulo', 'data', 'inicio', 'fim', 'local', 'docente', 'roteiros', 'grupo', 'discentes', 'observacoes', 'atualizadoEm', 'cancelado'];

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const periodOf = t => { const m = toMin(t); return m < 720 ? 'manha' : m < 1080 ? 'tarde' : 'noite'; };
const uid = () => Math.random().toString(36).slice(2, 10);
const norm = e => {
  const o = {};
  FIELDS.forEach(f => { o[f] = e && e[f] != null ? String(e[f]) : ''; });
  if (MOMENTO_ANTIGO[o.tutoriaTipo]) o.tutoriaTipo = MOMENTO_ANTIGO[o.tutoriaTipo];
  o.arquivosAnexados = Array.isArray(e && e.arquivosAnexados) ? e.arquivosAnexados.filter(Boolean) : [];

const cmpEv = (a, b) => a.data.localeCompare(b.data) || a.inicio.localeCompare(b.inicio) || a.titulo.localeCompare(b.titulo);
const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));

function linkify(raw) {
  const text = String(raw || '');
  const re = /(https?:\/\/[^\s<>"']+)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    let url = m[0], trail = '';
    const t = url.match(/[.,;:!?)\]]+$/);
    if (t) { trail = t[0]; url = url.slice(0, -trail.length); }
    out += esc(text.slice(last, m.index)) + `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>` + esc(trail);
    last = m.index + m[0].length;
  }
  out += esc(text.slice(last));
  return out.replace(/\n/g, '<br>');
}

const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } },
};

/* ---------- tema claro/escuro ---------- */
// Preferência salva vence; sem preferência salva, segue o tema do sistema.
// A cada clique no botão, passa a ser uma escolha explícita (guardada).
function temaEfetivo() {
  const salvo = store.get('cron.tema', null);
  if (salvo === 'light' || salvo === 'dark') return salvo;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function aplicarTema() {
  document.documentElement.setAttribute('data-theme', temaEfetivo());
  const btn = document.getElementById('theme-btn');
  if (btn) btn.innerHTML = icon(temaEfetivo() === 'dark' ? 'sun' : 'moon', 16);
}
function alternarTema() {
  store.set('cron.tema', temaEfetivo() === 'dark' ? 'light' : 'dark');
  aplicarTema();
}
aplicarTema();
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (store.get('cron.tema', null) === null) aplicarTema(); });
}

function groupBlocks(k, disc) {
  const sub = x => ({ label: x, title: 'Subgrupo ' + x, names: SUBGRUPOS[x] || [] });
  if (k === 'TODOS') return [{ label: 'TODOS', title: '', names: TODOS_ALFABETICA }];
  if (k && k.indexOf('&') > 0) return k.split('&').map(sub);
  if (TUTORIAS[k]) return [{ label: k, title: '', names: TUTORIAS[k] }];
  if (SUBGRUPOS[k]) return [sub(k)];
  if (DIVISOES[k]) return [{ label: k, title: 'Divisão ' + k, names: DIVISOES[k] }];
  return [];
}

function suggestMorfoDocente(dateISO) {
  const list = CONFIG.DOCENTES_MORFO;
  const mon = iso(mondayOf(parseISO(dateISO || iso(new Date()))));
  const morf = state.events.filter(e => e.disciplina === DISC_MORFO && list.indexOf(e.docente) >= 0);
  const mesmaSemana = morf.find(e => iso(mondayOf(parseISO(e.data))) === mon);
  if (mesmaSemana) return mesmaSemana.docente;
  const anterior = morf.filter(e => e.data < mon).sort(cmpEv).pop();
  return anterior ? list[(list.indexOf(anterior.docente) + 1) % list.length] : list[0];
}

class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code || ''; } }

// Espera o <script type="module"> do Firebase (no <head>) terminar de
// carregar — na prática isso já aconteceu bem antes de qualquer método do
// Remote ser chamado (o módulo roda enquanto a página ainda está sendo
// lida), mas esta espera existe como rede de segurança.
function waitFirebase() {
  if (window.Firebase) return Promise.resolve(window.Firebase);
  return new Promise(res => window.addEventListener('firebase-ready', () => res(window.Firebase), { once: true }));
}
const FB = () => window.Firebase;

// Converte qualquer erro do Firebase (Firestore, Auth ou Cloud Functions)
// no mesmo ApiError que o resto do site já sabe tratar — handleApiError()
// desloga sozinho quando o code é 'AUTH', exatamente como antes.
function toApiError(err) {
  try { console.error('[Firebase erro real]', err && err.code, err && err.message); } catch (_) {}
  const code = String((err && err.code) || '');
  const auth = code.indexOf('permission-denied') >= 0 || code.indexOf('unauthenticated') >= 0 || code === 'permission-denied';
  const msg = (err && err.message) ? String(err.message).replace(/^Firebase:\s*/, '').replace(/\s*\(\w[\w-]*\/[\w-]+\)\.?$/, '') : 'Erro no servidor.';
  return new ApiError(auth ? 'Sessão expirada. Entre novamente.' : msg, auth ? 'AUTH' : '');
}

// Sem Cloud Functions neste projeto (por escolha, pra não exigir o plano
// Blaze/cartão de crédito): tudo é gravação/leitura direta no Firestore

/* ---------- utilidades de leitura/gravação do Firestore ---------- */
function colecaoRef(nome) { return FB().collection(FB().db, nome); }
function docRef(nome, id) { return FB().doc(FB().db, nome, id); }
async function pegarTodos(nomeColecao) {
  const snap = await FB().getDocs(colecaoRef(nomeColecao));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function pegarOnde(nomeColecao, campo, valor) {
  const snap = await FB().getDocs(FB().query(colecaoRef(nomeColecao), FB().where(campo, '==', valor)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

/* ---------- Notificações disparadas pelo presidente (mural/evento) ----------
   Sem Cloud Functions: é o próprio navegador do presidente que calcula quem
   precisa ser avisado e grava em notificacoes/{usuario}/itens — autorizado
   pela regra "allow create: if presidente() || dono(usuario)". */
// Pede ao servidor (Cloudflare) pra enviar já o push das notificações recém-criadas.
// Se falhar, a função agendada pega no próximo ciclo (até ~5 min depois).
async function dispararPush() {
  try {
    const u = FB().auth.currentUser; if (!u || !CONFIG.VAPID_KEY || !CONFIG.PUSH_URL) return;
    await fetch(CONFIG.PUSH_URL, { method: 'POST', headers: { Authorization: 'Bearer ' + await u.getIdToken() } });
  } catch (err) { /* sem problema: o agendador cobre */ }
}
async function notificarUsuario(usuario, tipo, titulo, corpo, refId) {
  try {
    await FB().addDoc(FB().collection(FB().db, 'notificacoes', usuario, 'itens'), {
      tipo, titulo, corpo, refId: refId || '', lida: false, pushEnviado: false, criadoEm: new Date().toISOString(),
    });
  } catch (err) { /* nunca trava a ação principal por causa de notificação */ }
}
async function notificarTodosDiscentes(tipo, titulo, corpo, refId) {
  const usuarios = await pegarTodos('usuarios');
  await Promise.all(usuarios.filter(u => u.id !== 'presidente').map(u => notificarUsuario(u.id, tipo, titulo, corpo, refId)));
  dispararPush();
}
// Mesma lógica de "estouNesseEvento" (mais abaixo no arquivo), só que
// checando TODOS os discentes de uma vez, não só quem está logado agora.
function nomesCitadosEm(discentesTexto) {
  return String(discentesTexto || '').split('\n').map(linha => {
    const m = linha.match(/^\s*\d+\s*\|\s*(.+?)\s*$/);
    return m ? tokensDeNome(m[1]) : null;
  }).filter(Boolean);
}
async function citadosNoEvento(evento) {
  const nomes = nomesCitadosEm(evento.discentes);
  if (!nomes.length) return [];
  const usuarios = await pegarTodos('usuarios');
  return usuarios.filter(u => u.id !== 'presidente' && nomes.some(n => mesmoNome(tokensDeNome(u.nome || u.id), n))).map(u => u.id);
}
async function notificarEventoAlterado(evento, titulo, corpo) {
  const [seguidores, citados] = await Promise.all([
    pegarOnde('acompanhados', 'eventoId', evento.id).then(r => r.map(x => x.usuario)),
    citadosNoEvento(evento),
  ]);
  const publico = Array.from(new Set([...seguidores, ...citados]));
  await Promise.all(publico.map(u => notificarUsuario(u, 'evento', titulo, corpo, evento.id)));
  dispararPush();
}
// Hash SHA-256 (Web Crypto, nativo do navegador) — usado pra conferir a
// segunda senha da aba Notas sem nunca mandar a senha de ninguém pro
// Firestore (só o hash fica salvo em usuarios/{usuario}.senhaNotasHash).
async function sha256Hex(texto) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(texto == null ? '' : texto)));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function uidAleatorio() {
  return (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(16) + Math.random().toString(16).slice(2)));
}
// Apaga todos os documentos de uma coleção, em lotes de até 450 (limite do
// Firestore é 500 operações por batch) — usada só em "Encerrar Semestre".
async function apagarColecaoInteira(nomeColecao) {
  const snap = await FB().getDocs(colecaoRef(nomeColecao));
  const docs = snap.docs;
  for (let i = 0; i < docs.length; i += 450) {
    const pedaco = docs.slice(i, i + 450);
    const batch = FB().writeBatch(FB().db);
    pedaco.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
}

// Mesma lógica de enriquecerArquivo_/linkPdf_ do Code.gs, mas calculando o
// link de abrir/baixar a partir da URL do Firebase Storage (upload) ou do
// link informado (Google Docs/Slides/Planilhas, site, link de livro).
function linkPdfDeLink(link) {
  const doc = String(link || '').match(/docs\.google\.com\/document\/d\/([\w-]+)/);
  if (doc) return 'https://docs.google.com/document/d/' + doc[1] + '/export?format=pdf';
  const slide = String(link || '').match(/docs\.google\.com\/presentation\/d\/([\w-]+)/);
  if (slide) return 'https://docs.google.com/presentation/d/' + slide[1] + '/export/pdf';
  const sheet = String(link || '').match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/);
  if (sheet) return 'https://docs.google.com/spreadsheets/d/' + sheet[1] + '/export?format=pdf';
  return null;
}
function enriquecerArquivoFs(o) {
  if (o.origem === 'upload' && o.downloadUrl) {
    o.pdfUrl = o.mimeType === 'application/pdf' ? o.downloadUrl : '';
    o.abrirUrl = o.downloadUrl;
  } else {
    o.downloadUrl = '';
    o.pdfUrl = linkPdfDeLink(o.link) || '';
    o.abrirUrl = o.link || '';
  }
  return o;
}

// Monta o array "mural" exatamente como readMural_ (Code.gs) montava: cada
// aviso ganha lidoPor/votos/meuVoto/votantes a partir das coleções
// muralLido/muralVotos (o equivalente às antigas abas MuralLido/MuralVotos).
async function montarMural(usuarioAtual) {
  const [avisos, lidos, votosTd] = await Promise.all([pegarTodos('mural'), pegarTodos('muralLido'), pegarTodos('muralVotos')]);
  const lidoPorAviso = {}, votosPorAviso = {};
  lidos.forEach(l => { (lidoPorAviso[l.avisoId] = lidoPorAviso[l.avisoId] || []).push(l.usuario); });
  votosTd.forEach(v => { (votosPorAviso[v.avisoId] = votosPorAviso[v.avisoId] || []).push(v); });
  const alvo = String(usuarioAtual || '').toLowerCase();
  return avisos.map(a => {
    const opcoes = Array.isArray(a.opcoes) ? a.opcoes : [];
    const votosDoAviso = votosPorAviso[a.id] || [];
    return {
      ...a,
      eventoIds: Array.isArray(a.eventoIds) ? a.eventoIds : [],
      arquivoIds: Array.isArray(a.arquivoIds) ? a.arquivoIds : [],
      lidoPor: lidoPorAviso[a.id] || [],
      opcoes,
      votos: opcoes.map((_, i) => votosDoAviso.filter(v => v.opcao === String(i)).length),
      meuVoto: votosDoAviso.filter(v => v.usuario.toLowerCase() === alvo).map(v => Number(v.opcao)),
      votantes: opcoes.map((_, i) => votosDoAviso.filter(v => v.opcao === String(i)).map(v => v.usuario)),
    };
  }).sort((a, b) => (b.criadoEm || '').localeCompare(a.criadoEm || ''));
}

const SENHA_TECNICA_DISCENTE = 'turma23b-sessao-2026-sem-senha-';
const SENHA_PRESIDENTE = '23b23b';

const Remote = {

    if (!u) throw new ApiError('Informe o usuário.');
    if (u === 'presidente' && String(senha || '') !== SENHA_PRESIDENTE) throw new ApiError('Senha incorreta.');
    const email = u + '@turma23b.local';
    const senhaReal = u === 'presidente' ? SENHA_PRESIDENTE : (SENHA_TECNICA_DISCENTE + u);
    // Autentica (ou cria a conta, se for a primeira vez) ANTES de olhar o
    // Firestore — as regras só liberam leitura pra quem já está autenticado,
    // então checar "o usuário existe?" antes da autenticação sempre seria
    // negado, mesmo pro usuário certo.
    let cred;
    try {
      cred = await FB().signInWithEmailAndPassword(FB().auth, email, senhaReal);
    } catch (err) {
      const code = String((err && err.code) || '');
      // Versões recentes do Firebase Auth não dizem mais separadamente
      // "não existe" vs "senha errada" (por segurança, pra ninguém descobrir
      // por tentativa quais usuários existem) — tudo vira um erro genérico
      // ("invalid-credential"/"invalid-login-credentials"). Como a senha que
      // a gente manda já é sempre a certa (é gerada aqui mesmo), um erro
      // aqui só pode mesmo ser "essa conta ainda não existe" — então cria.
      const podeSerPrimeiraVez = code.indexOf('user-not-found') >= 0 || code.indexOf('invalid-credential') >= 0 || code.indexOf('invalid-login-credentials') >= 0;
      if (podeSerPrimeiraVez) {
        // Primeira vez dessa pessoa — cria a conta sozinho, sem precisar de
        // ninguém clicar em nada no Firebase Console.
        try { cred = await FB().createUserWithEmailAndPassword(FB().auth, email, senhaReal); }
        catch (err2) { throw toApiError(err2); }
      } else {
        throw toApiError(err);
      }
    }
    const role = u === 'presidente' ? 'presidente' : 'user';
    let nomeReal = '';
    if (role !== 'presidente') {
      // Agora já autenticado como esse próprio usuário — a regra "dono()"
      // libera ler o próprio documento. Se não existir, essa pessoa não é
      // discente de verdade: desfaz a sessão e recusa.
      const snap = await FB().getDoc(docRef('usuarios', u));
      if (!snap.exists()) {
        await FB().signOut(FB().auth);
        throw new ApiError('Usuário não encontrado.');
      }
      nomeReal = snap.data().nome || '';
    }
    return { role, usuario: u, nomeReal, token: 'firebase' };
  },

  async sync(usuario, v, va, vm, vd, vav, vdi, vc) {
    await waitFirebase();
    try {
      // Sem Cloud Functions, não existe mais nada atualizando um contador de
      // versão central (era isso que decidia "mudou, vale a pena buscar de
      // novo?"). Mais simples e confiável: busca tudo de novo a cada sync —
      // o volume de dados de uma turma é pequeno, o custo disso é mínimo.
      const agora = String(Date.now());
      const out = {
        version: agora, versionArq: agora, versionMural: agora, versionDatas: agora, versionConfig: agora,
        serverTime: new Date().toISOString(), appUrl: '',
      };

      const tarefas = [
        pegarTodos('eventos').then(r => { out.events = r; }),
        pegarTodos('arquivos').then(r => { out.arquivos = r.map(enriquecerArquivoFs); }),
        montarMural(usuario).then(r => { out.mural = r; }),
        pegarTodos('datasImportantes').then(r => { out.datas = r.sort((a, b) => a.data.localeCompare(b.data)); }),
        pegarTodos('config').then(r => { const cfg = {}; r.forEach(c => { cfg[c.id] = c.valor; }); out.config = cfg; }),
      ];
      if (usuario) {
        tarefas.push(pegarOnde('acompanhados', 'usuario', String(usuario).toLowerCase()).then(r => { out.followed = r.map(x => x.eventoId); }));
        tarefas.push(pegarOnde('notas', 'usuario', String(usuario).toLowerCase()).then(r => { out.notas = r; }));
        tarefas.push(FB().getDoc(docRef('usuarios', String(usuario).toLowerCase())).then(s => { out.nomeReal = s.exists() ? (s.data().nome || '') : ''; }));
      } else { out.followed = []; out.notas = []; out.nomeReal = ''; }

      const souPresidente = String(usuario || '').trim().toLowerCase() === 'presidente';
      if (souPresidente) {
        // O presidente é o único autorizado (pelas regras) a listar a coleção
        // "usuarios" inteira. Pra quem não é presidente também ver os
        // aniversariantes sem precisar dessa permissão, o presidente publica
        // aqui uma listinha pública (só nome+aniversário) em config/aniversariantes
        // — coleção que qualquer usuário logado já pode ler.
        out.versionAvaliacoes = agora;
        out.versionDiscentes = agora;
        tarefas.push(pegarTodos('avaliacoes').then(r => { out.avaliacoes = r; }));
        tarefas.push(pegarTodos('usuarios').then(r => {
          out.discentes = r.filter(u => u.id !== 'presidente').map(u => ({ usuario: u.id, nome: u.nome || '', email: u.email || '', matricula: u.matricula || '', telefone: u.telefone || '', temSenhaNotas: !!u.senhaNotasHash }));
          const lista = r.filter(u => /^\d{2}-\d{2}$/.test(u.aniversario || '')).map(u => ({ usuario: u.id, nome: u.nome || '', aniversario: u.aniversario }));
          out.aniversariantes = lista;
          FB().setDoc(docRef('config', 'aniversariantes'), { lista }, { merge: true }).catch(() => { /* não crítico */ });
        }));
      } else {
        tarefas.push(FB().getDoc(docRef('config', 'aniversariantes')).then(s => {
          out.aniversariantes = (s.exists() && Array.isArray(s.data().lista)) ? s.data().lista : [];
        }).catch(() => { out.aniversariantes = []; }));
      }
      await Promise.all(tarefas);
      return out;
    } catch (err) { throw toApiError(err); }
  },

  async saveEvent(token, ev) {
    try {
      await waitFirebase();
      const e = norm(ev);
      const eraNovo = !e.id;
      if (!e.id) e.id = FB().doc(FB().collection(FB().db, 'eventos')).id;
      e.atualizadoEm = new Date().toISOString();
      let antes = null;
      if (!eraNovo) {
        const snap = await FB().getDoc(docRef('eventos', e.id));
        antes = snap.exists() ? snap.data() : null;
      }
      const { id, ...dados } = e;
      await FB().setDoc(docRef('eventos', id), dados);
      if (antes) {
        const partes = [];
        if (antes.data !== dados.data || antes.inicio !== dados.inicio || antes.fim !== dados.fim) partes.push('horário');
        if ((antes.local || '') !== (dados.local || '')) partes.push('sala/local');
        if ((antes.docente || '') !== (dados.docente || '')) partes.push('professor');
        const cancelouAgora = (antes.cancelado || '') !== 'Sim' && dados.cancelado === 'Sim';
        const reabriuAgora = (antes.cancelado || '') === 'Sim' && dados.cancelado !== 'Sim';
        if (cancelouAgora) partes.push('cancelamento');
        if (reabriuAgora) partes.push('reabertura');
        if (partes.length) {
          const titulo = cancelouAgora ? 'Evento cancelado' : 'Evento alterado';
          const corpo = (dados.titulo || 'Um evento') + ' — mudou: ' + partes.join(', ') + '.';
          notificarEventoAlterado({ id, ...dados }, titulo, corpo); // não espera — não trava a resposta
        }
      }
      return { event: e, version: String(Date.now()) };
    } catch (err) { throw toApiError(err); }
  },

    try {

          batch.set(docRef('muralVotos', idDestaOpcao), { usuario: u, avisoId, opcao: op });
          await batch.commit();
        } else {
          await FB().setDoc(docRef('muralVotos', idDestaOpcao), { usuario: u, avisoId, opcao: op });

// quanto pelo em lote — espelha limpaAvaliacao_ do Code.gs, pra não validar

function limparAvaliacaoLocal(raw) {
  const a = Object.assign({}, raw);
  if (!a.usuario) throw new ApiError('Discente não encontrado.');
  if (DISCIPLINAS.indexOf(a.disciplina) < 0) throw new ApiError('Disciplina inválida.');
  a.eixo = a.disciplina === DISC_HAB ? String(a.eixo || '') : '';
  if (a.disciplina === DISC_HAB && !a.eixo) throw new ApiError('Escolha o eixo de Habilidades Profissionais.');
  if (TIPOS_AVALIACAO.indexOf(a.tipo) < 0) throw new ApiError('Escolha se é Nota Somativa, Formativa ou Completa.');
  const precisaModulo = precisaModuloAvaliacao(a.disciplina, a.tipo);
  a.modulo = precisaModulo ? String(a.modulo || '').trim() : '';
  if (precisaModulo && !a.modulo) throw new ApiError('Informe o módulo (' + a.disciplina + ').');
  const notaMaxima = Number(a.notaMaxima);
  if (NOTAS_MAXIMAS_VALIDAS.indexOf(notaMaxima) < 0) throw new ApiError('Nota máxima inválida.');
  const nota = Number(String(a.nota == null ? '' : a.nota).replace(',', '.'));
  if (isNaN(nota) || nota < 0 || nota > notaMaxima) throw new ApiError('Informe uma nota válida (até ' + notaMaxima + ').');
  a.nota = String(nota);
  a.notaMaxima = String(notaMaxima);
  return a;
}

}

    const s = db.sessoesTutoria[eventoId];
    if (!s) return { existe: false, status: 'aberta', objetivos: null, iniciadoPor: '', meuRelatorio: null };
    const out = { existe: true, status: s.status, objetivos: s.objetivos, iniciadoPor: s.iniciadoPor || '', meuRelatorio: null };
    if (s.status === 'encerrada' && s.relatorio) {
      const d = db.discentes.find(x => x.usuario === usuario);
      const tokensNome = d && d.nome ? tokensDeNome(d.nome) : [];
      const tokensUsuario = tokensDeNome(usuario);
      const chave = Object.keys(s.relatorio).find(nomeChave => {
        const tokensChave = tokensDeNome(nomeChave);
        return (tokensNome.length && mesmoNome(tokensNome, tokensChave)) || (tokensUsuario.length && mesmoNome(tokensUsuario, tokensChave));
      });
      out.meuRelatorio = chave !== undefined ? s.relatorio[chave] : null;
    }
    return out;
  },
  async salvarObjetivosTutoria(usuario, eventoId, objetivos) {
    if (!Array.isArray(objetivos) || !objetivos.length) throw new ApiError('Informe ao menos um objetivo.');
    const db = this.db();
    if (!db.sessoesTutoria) db.sessoesTutoria = {};
    const atual = db.sessoesTutoria[eventoId];
    if (atual && atual.status === 'encerrada') throw new ApiError('Esta sessão já foi encerrada e não pode mais ser editada.');
    db.sessoesTutoria[eventoId] = Object.assign({}, atual, { objetivos, status: 'aberta', iniciadoPor: (atual && atual.iniciadoPor) || usuario });
    store.set('cron.demo', db);
    return { ok: true };
  },
  async encerrarSessaoTutoria(usuario, eventoId, relatorio) {
    if (!relatorio || typeof relatorio !== 'object' || Array.isArray(relatorio)) throw new ApiError('Relatório inválido.');
    const db = this.db();
    if (!db.sessoesTutoria) db.sessoesTutoria = {};
    const atual = db.sessoesTutoria[eventoId];
    if (!atual) throw new ApiError('Defina os objetivos antes de encerrar a sessão.');
    if (atual.status === 'encerrada') throw new ApiError('Esta sessão já foi encerrada.');
    atual.status = 'encerrada';
    atual.relatorio = relatorio;
    store.set('cron.demo', db);
    return { ok: true };
  },
  // Espelham salvarConfiguracaoSemestre_/encerrarSemestre_/listarSemestres_/
  // lerSemestreArquivado_ do Code.gs. No modo demonstração não há abas de
  // planilha pra esconder — o "arquivamento" é só uma cópia guardada em
  // db.semestres — mas o comportamento visível é o mesmo: Eventos, Mural,
  // Arquivos e Datas Importantes voltam vazios, e as notas (avaliacoes) são
  // descartadas sem entrar em nenhum lugar que o site volte a mostrar, nem
  // pro presidente — exatamente como a aba escondida faz no servidor real.
  async salvarConfiguracaoSemestre(token, config) {
    if (token !== 'demo') throw new ApiError('Sessão expirada. Entre novamente.', 'AUTH');
    const cfg = config || {};
    const eixos = Array.isArray(cfg.eixos) ? cfg.eixos.map(x => String(x || '').trim()).filter(Boolean) : [];
    const tutorias = (cfg.tutorias && typeof cfg.tutorias === 'object') ? cfg.tutorias : {};
    const subgrupos = (cfg.subgrupos && typeof cfg.subgrupos === 'object') ? cfg.subgrupos : {};
    const docentesEixos = (cfg.docentesEixos && typeof cfg.docentesEixos === 'object') ? cfg.docentesEixos : {};
    if (!eixos.length) throw new ApiError('Informe ao menos um eixo de Habilidades Profissionais.');
    if (!Array.isArray(tutorias.T1) || !tutorias.T1.length || !Array.isArray(tutorias.T2) || !tutorias.T2.length) {
      throw new ApiError('Informe os dois grupos de tutoria (T1 e T2), cada um com pelo menos um discente.');
    }
    if (!['A', 'B', 'C', 'D'].every(k => Array.isArray(subgrupos[k]) && subgrupos[k].length)) {
      throw new ApiError('Informe os quatro subgrupos de Habilidades Profissionais (A, B, C e D), cada um com pelo menos um discente.');
    }
    const db = this.db();
    db.config = { eixos, docentesEixos, tutorias: { T1: tutorias.T1, T2: tutorias.T2 }, subgrupos: { A: subgrupos.A, B: subgrupos.B, C: subgrupos.C, D: subgrupos.D } };
    db.versionConfig = String(Date.now());
    store.set('cron.demo', db);
    return { versionConfig: db.versionConfig };
  },
  async encerrarSemestre(token, rotulo) {
    if (token !== 'demo') throw new ApiError('Sessão expirada. Entre novamente.', 'AUTH');
    const r = String(rotulo || '').trim();
    if (!r) throw new ApiError('Informe um rótulo para o semestre que está terminando (ex.: "2025.2").');
    const db = this.db();
    db.semestres.unshift({
      id: arqUid(), rotulo: r, encerradoEm: new Date().toISOString(),
      eventos: db.events, mural: db.mural, arquivos: db.arquivos, datas: db.datas,
    });
    db.events = []; db.mural = []; db.arquivos = []; db.datas = []; db.avaliacoes = [];
    db.version = String(Date.now());
    db.versionMural = String(Date.now());
    db.versionArq = String(Date.now());
    db.versionDatas = String(Date.now());
    db.versionAvaliacoes = String(Date.now());
    store.set('cron.demo', db);
    return { rotulo: r };
  },
  async listarSemestres(token) {
    if (token !== 'demo') throw new ApiError('Sessão expirada. Entre novamente.', 'AUTH');
    const db = this.db();
    return { semestres: db.semestres.map(s => ({ id: s.id, rotulo: s.rotulo, encerradoEm: s.encerradoEm })) };
  },
  async lerSemestreArquivado(token, id) {
    if (token !== 'demo') throw new ApiError('Sessão expirada. Entre novamente.', 'AUTH');
    const db = this.db();
    const s = db.semestres.find(x => x.id === id);
    if (!s) throw new ApiError('Semestre não encontrado.');
    return { rotulo: s.rotulo, encerradoEm: s.encerradoEm, eventos: s.eventos, mural: s.mural, arquivos: s.arquivos, datas: s.datas };
  },
};

function loadCache() {
