   ===================================================================== */
function setSync(status) {
  state.sync.status = status;
  if (status === 'ok') state.sync.at = new Date();
  updateSync();
}
function updateSync() {
  const el = $('#sync');
  if (!el) return;
  const { status, at } = state.sync;
  const hora = at ? at.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
  el.className = 'sync-dot no-print is-' + (status === 'ok' && IS_DEMO ? 'local' : status);
  // o texto só aparece como dica ao passar o mouse (não fica escrito na tela)
  const dica =
    status === 'syncing' ? 'Sincronizando…' :
    status === 'error' ? 'Sem conexão, exibindo dados salvos' :
    IS_DEMO ? 'Salvo neste navegador' : 'Sincronizado às ' + hora + ' — clique para sincronizar agora';
  el.title = dica;
  el.setAttribute('aria-label', dica);
}

async function sync(opts) {
  const { force = false, silent = true } = opts || {};
  if (!state.session || syncing) return;
  syncing = true;
  if (!silent || state.sync.status !== 'ok') setSync('syncing');
  try {
    const r = await Backend.sync(state.session.usuario, force ? '' : state.version, force ? '' : state.versionArq, force ? '' : state.versionMural, force ? '' : state.versionDatas, force ? '' : state.versionAvaliacoes, force ? '' : state.versionDiscentes, force ? '' : state.versionConfig);
    let changed = false;
    if (r.events) {
      const ne = r.events.map(norm);
      if (JSON.stringify(ne) !== JSON.stringify(state.events)) { state.events = ne; changed = true; }
    }
    if (r.arquivos) {
      if (JSON.stringify(r.arquivos) !== JSON.stringify(state.arquivos)) { state.arquivos = r.arquivos; changed = true; }
    }
    if (r.mural) {
      const nm = r.mural.map(normalizarAviso);
      if (JSON.stringify(nm) !== JSON.stringify(state.mural)) { state.mural = nm; changed = true; }
    }
    if (r.datas) {
      if (JSON.stringify(r.datas) !== JSON.stringify(state.datas)) { state.datas = r.datas; changed = true; }
    }
    if (r.notas) {
      if (JSON.stringify(r.notas) !== JSON.stringify(state.notas)) { state.notas = r.notas; changed = true; }
    }
    if (r.aniversariantes) {
      if (JSON.stringify(r.aniversariantes) !== JSON.stringify(state.aniversariantes)) { state.aniversariantes = r.aniversariantes; changed = true; }
    }
    if (r.avaliacoes) {
      if (JSON.stringify(r.avaliacoes) !== JSON.stringify(state.avaliacoes)) { state.avaliacoes = r.avaliacoes; changed = true; }
    }
    if (r.discentes) {
      if (JSON.stringify(r.discentes) !== JSON.stringify(state.discentes)) { state.discentes = r.discentes; changed = true; }
    }
    if (r.config) {
      aplicarConfiguracao(r.config);
      changed = true;
    }
    if (r.nomeReal !== undefined && r.nomeReal !== state.session.nome) {
      state.session.nome = r.nomeReal;
      store.set('cron.session', state.session);
      changed = true;
    }
    if (r.followed && state.pending === 0 && state.session.role !== 'presidente') {
      const nf = new Set(r.followed);
      if (!sameSet(nf, state.followed)) { state.followed = nf; changed = true; }
    }
    state.version = r.version;
    if (r.versionArq !== undefined) state.versionArq = r.versionArq;
    if (r.versionMural !== undefined) state.versionMural = r.versionMural;
    if (r.versionDatas !== undefined) state.versionDatas = r.versionDatas;
    if (r.versionAvaliacoes !== undefined) state.versionAvaliacoes = r.versionAvaliacoes;
    if (r.versionDiscentes !== undefined) state.versionDiscentes = r.versionDiscentes;
    if (r.versionConfig !== undefined) state.versionConfig = r.versionConfig;
    if (r.appUrl) state.appUrl = r.appUrl;
    saveCache();
    setSync('ok');
    if (changed) refreshUI();
  } catch (e) {
    setSync('error');
    console.error('Falha ao sincronizar:', e);
    if (!silent) toast(e.message || 'Não foi possível sincronizar.', 'err');
  } finally {
    syncing = false;
  }
}

function startPolling() {
  stopPolling();
  pollId = setInterval(() => { if (!document.hidden) sync(); }, CONFIG.POLL_MS);
}
function stopPolling() { if (pollId) { clearInterval(pollId); pollId = null; } }

async function doLogin(form) {
  const usuario = form.querySelector('[name=usuario]').value.trim();
  const campoSenha = form.querySelector('[name=senha]');
  const senha = campoSenha ? campoSenha.value : '';
  const errEl = $('#lg-err');
  const showErr = m => { errEl.textContent = m; errEl.hidden = false; };
  if (!usuario) return showErr('Informe o usuário.');
  if (loginRole === 'user' && usuario.toLowerCase() === 'presidente') return showErr('Para entrar como presidente, use a aba Presidente.');
  if (loginRole === 'presidente' && !senha) return showErr('Informe a senha.');
  const btn = form.querySelector('[data-action="submit-login"]');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const r = await Backend.login(usuario, senha);
    state.session = { role: r.role, usuario: r.usuario, token: r.token || null, nome: r.nomeReal || '' };
    store.set('cron.session', state.session);
    state.tab = 'cronograma'; state.view = 'dia'; state.cursor = new Date();
    state.followed = new Set(); state.events = []; state.version = '';
    state.minhasNotas = null; state.notasToken = null; state.avaliacoes = []; state.discentes = [];
    loadCache();
    enterApp();
    await sync({ force: true, silent: false });
    iniciarNotificacoes();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Entrar';
    showErr(e.message || 'Não foi possível entrar.');
  }
}

function logout(msg) {
  stopPolling();
  desregistrarPush();
  pararNotificacoes();
  closeModal();
  store.del('cron.session');
  state.session = null;
  state.minhasNotas = null;
  state.notasToken = null;
  loginRole = 'user';
  if (!IS_DEMO && window.Firebase && window.Firebase.auth.currentUser) {
    window.Firebase.signOut(window.Firebase.auth).catch(() => {});
  }
  renderLogin(msg);
}

function handleApiError(e) {
  if (e && e.code === 'AUTH') { logout(e.message); return true; }
  return false;
}

function printHeadHTML(title, sub) {

const visibleEvents = () => state.events.filter(e => !state.hidden.has(catKey(e)));

function scheduleHTML(isP) {
  const dia = state.view === 'dia';
  const month = state.view === 'mes';
  const list = visibleEvents();
  const mon = mondayOf(state.cursor);
  const body = dia ? todayHTML(list, { canCreate: isP })
    : month ? monthHTML(state.cursor, list)
    : gridHTML(mon, list, { canCreate: isP }) + listHTML(mon, list, { canCreate: isP });
  return toolbarHTML({ allowMonth: true, canCreate: isP, canPrint: isP && !month && !dia, canCalendar: true })
    + legendHTML()
    + printHeadHTML(dia ? 'Cronograma de hoje' : 'Cronograma semanal', dia ? iso(new Date()) : weekLabel(mon))
    + body;
}

function weekIndex(mon, events) {
  const domingo = iso(addDays(mon, 6));
  const n = events.some(e => e.data === domingo) ? 7 : 6;
  const days = Array.from({ length: n }, (_, i) => addDays(mon, i));
  const byKey = {};
  events.forEach(e => { const k = e.data + '|' + periodOf(e.inicio); (byKey[k] = byKey[k] || []).push(e); });
  Object.keys(byKey).forEach(k => byKey[k].sort(cmpEv));
  return { days, byKey };
}

// "Esse evento é meu?" — o nome da pessoa consta na lista de discentes do
// evento? A comparação é de propósito tolerante, porque cada um escreve o nome
// de um jeito: não liga pra acento nem maiúscula, ignora "de/da/dos/e", e aceita
// nome completo, só o primeiro nome, ou primeiro nome + sobrenome. Se a coluna
// "nome" da planilha estiver vazia, usa o nome de usuário (ex.: "arthur").
// O PRIMEIRO nome tem que ser o mesmo por inteiro: "gabriel" não pega "Gabriella".
const PARTICULAS_NOME = ['de', 'da', 'do', 'das', 'dos', 'e'];
const tokensDeNome = s => dobraAcento(s).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(t => t && PARTICULAS_NOME.indexOf(t) < 0);

function mesmoNome(a, b) {
  if (!a.length || !b.length || a[0] !== b[0]) return false;
  const resto = (x, y) => x.slice(1).every(t => y.indexOf(t) >= 0);
  return resto(a, b) || resto(b, a);
}

function estouNesseEvento(e) {
  if (!state.session || !e.discentes) return false;
  const identidades = [state.session.nome, state.session.usuario].map(v => tokensDeNome(v || '')).filter(t => t.length);
  if (!identidades.length) return false;
  return e.discentes.split('\n').some(linha => {
    const m = linha.match(/^\s*\d+\s*\|\s*(.+?)\s*$/);
    if (!m) return false; // linhas de título ("Subgrupo A:") e em branco não são nomes
    const nomeNaLista = tokensDeNome(m[1]);
    return identidades.some(id => mesmoNome(id, nomeNaLista));
  });
}

function cardHTML(e) {
  const isP = state.session.role === 'presidente';
  const fol = !isP && state.followed.has(e.id);
  const canc = e.cancelado === 'Sim';
  const souEu = !isP && estouNesseEvento(e);
  return `<button class="ev ${fol ? 'has-star' : ''} ${canc ? 'is-cancelada' : ''} ${souEu ? 'has-mine' : ''}" style="${catStyle(catKey(e))}" data-action="open-event" data-id="${esc(e.id)}">
    ${souEu ? `<span class="ev-mine" role="img" title="Você está na lista deste evento" aria-label="Você está na lista deste evento">${icon('userCheck', 14)}</span>` : ''}
    ${fol ? `<span class="ev-star" title="Você acompanha este evento">${icon('star', 13, true)}</span>` : ''}
    <span class="ev-time">${esc(e.inicio)} às ${esc(e.fim)}</span>
    <span class="ev-title">${esc(e.titulo)}</span>
    <span class="ev-meta">${esc(discShort(e))}</span>
    ${e.grupo ? `<span class="ev-meta">${esc(grupoLabel(e.grupo))}</span>` : ''}
    <span class="ev-detail">
      ${e.local ? `<span>${icon('pin', 12)}${esc(e.local)}</span>` : ''}
      ${e.docente ? `<span>${icon('user', 12)}${esc(e.docente)}</span>` : ''}
    </span>
    ${canc ? `<span class="ev-cancel-badge">${icon('x', 11)} Cancelada</span>` : ''}
  </button>`;
}

// Quando dois (ou mais) eventos do mesmo período/dia se sobrepõem no horário,
// eles ficam lado a lado (colunas) em vez de empilhados, com o que começa
// mais cedo posicionado um pouco mais acima — como numa agenda de verdade.
// Sem sobreposição, o card sai idêntico a antes (sem embrulho extra).
function clusterEvents(events) {
  const items = events.slice().sort((a, b) => toMin(a.inicio) - toMin(b.inicio) || toMin(a.fim) - toMin(b.fim));
  const clusters = [];
  let atual = [], fimAtual = -1;
  items.forEach(e => {
    const inicio = toMin(e.inicio);
    if (atual.length && inicio >= fimAtual) { clusters.push(atual); atual = []; fimAtual = -1; }
    atual.push(e);
    fimAtual = Math.max(fimAtual, toMin(e.fim));
  });
  if (atual.length) clusters.push(atual);
  return clusters;
}
function clusterHTML(cluster) {
  if (cluster.length === 1) return cardHTML(cluster[0]);
  const inicioCluster = Math.min(...cluster.map(e => toMin(e.inicio)));
  const PX_POR_MIN = 0.6, DESLOC_MAX = 48;
  return `<div class="ev-row">` + cluster.map(e => {
    const desloc = Math.min(DESLOC_MAX, Math.round((toMin(e.inicio) - inicioCluster) * PX_POR_MIN));
    return `<div class="ev-col" style="margin-top:${desloc}px">${cardHTML(e)}</div>`;
  }).join('') + `</div>`;
}

function gridHTML(mon, events, o) {
  const { days, byKey } = weekIndex(mon, events);
  const today = iso(new Date());
  const cols = days.map((d, i) => `minmax(0,${i === DIA_LARGO ? DIA_LARGO_FR : 1}fr)`).join(' ');
  let h = `<div class="wk ${o.detailed ? 'detailed' : ''}" style="--cols:${days.length};grid-template-columns:104px ${cols}"><div></div>`;
  days.forEach((d, i) => { h += `<div class="wk-head ${iso(d) === today ? 'is-today' : ''}"><span class="wd">${WD_SHORT[i]}</span><span class="dn">${d.getDate()}</span></div>`; });
  PERIODS.forEach(p => {
    h += `<div class="wk-period">${icon(p.icon, 18)}<span>${p.nome}</span><small>${p.hint}</small></div>`;
    days.forEach(d => {
      const k = iso(d);
      const list = byKey[k + '|' + p.k] || [];
      h += `<div class="wk-cell ${k === today ? 'is-today' : ''}">${clusterEvents(list).map(clusterHTML).join('')}`
        + (o.canCreate ? `<button class="add-cell" data-action="new-in-cell" data-date="${k}" data-period="${p.k}" aria-label="Adicionar evento em ${WD_SHORT[days.indexOf(d)]}, ${p.nome}">${icon('plus', 15)}</button>` : '')
        + `</div>`;
    });
  });
  return h + '</div>';
}

// Um dia só (cabeçalho + eventos por período) — usado tanto na lista da
// semana no celular (um "dl-day" por dia da semana) quanto na visão "Hoje"
// (um "dl-day" sozinho, sempre o de hoje). É o mesmo cardHTML() da grade
// semanal por baixo, então o sinal de "você está na lista" e a estrela de
// "você acompanha" aparecem igual nas duas visões.
function diaCardHTML(d, nomeDiaSemana, byKey, o) {
  const today = iso(new Date());
  const k = iso(d);
  const has = PERIODS.some(p => (byKey[k + '|' + p.k] || []).length);
  return `<section class="dl-day ${k === today ? 'is-today' : ''}">
      <header class="dl-head"><span>${capitalize(nomeDiaSemana)}<small>${d.getDate()} ${MES_ABR[d.getMonth()]}</small></span>
        ${o.canCreate ? `<button class="btn sm ghost" data-action="new-in-day" data-date="${k}">${icon('plus', 14)} Evento</button>` : ''}</header>
      <div class="dl-body">${has ? PERIODS.map(p => {
        const l = byKey[k + '|' + p.k] || [];
        return l.length ? `<div><div class="dl-plabel">${icon(p.icon, 14)} ${p.nome}</div><div class="stack">${l.map(cardHTML).join('')}</div></div>` : '';
      }).join('') : '<div class="dl-empty">Sem eventos</div>'}</div>
    </section>`;
}

function listHTML(mon, events, o) {
  const { days, byKey } = weekIndex(mon, events);
  return `<div class="dl ${o.detailed ? 'detailed' : ''}">` + days.map((d, i) => diaCardHTML(d, WD_LONG[i], byKey, o)).join('') + '</div>';
}

// Visão "Hoje": o mesmo card de um dia, só que sempre o de hoje — não
// depende de state.cursor, igual uma "fotografia" fixa do dia atual.
function todayHTML(events, o) {
  const hoje = new Date();
  const k = iso(hoje);
  const byKey = {};
  events.filter(e => e.data === k).forEach(e => { const chave = k + '|' + periodOf(e.inicio); (byKey[chave] = byKey[chave] || []).push(e); });
  Object.keys(byKey).forEach(chave => byKey[chave].sort(cmpEv));
  const nomeDiaSemana = WD_LONG[(hoje.getDay() + 6) % 7]; // getDay(): 0=domingo; WD_LONG começa na segunda
  return `<div class="dl-solo">${diaCardHTML(hoje, nomeDiaSemana, byKey, o)}</div>`;
}

function monthHTML(cur, events) {
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
  const start = mondayOf(first), end = addDays(mondayOf(last), 6);
  const byDate = {};
  events.forEach(e => { (byDate[e.data] = byDate[e.data] || []).push(e); });
  const today = iso(new Date());
  const MAX = 4;
  let h = `<div class="mo">` + WD_SHORT.map(w => `<div class="mo-wd">${w}</div>`).join('');
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const k = iso(d);
    const list = (byDate[k] || []).sort(cmpEv);
    let shown = 0, mini = '';
    PERIODS.forEach(p => {
      const l = list.filter(e => periodOf(e.inicio) === p.k);
      if (!l.length || shown >= MAX) return;
      mini += `<div class="mo-plabel">${p.nome}</div>`;
      l.forEach(e => {
        if (shown >= MAX) return;
        shown++;
        mini += `<button class="mini" style="${catStyle(catKey(e))}" data-action="open-event" data-id="${esc(e.id)}" title="${esc(e.titulo)}"><i></i><b>${esc(e.inicio)}</b>${state.session.role !== 'presidente' && estouNesseEvento(e) ? `<span class="mini-mine" title="Você está na lista deste evento">${icon('userCheck', 12)}</span>` : ''}<span>${esc(e.titulo)}</span></button>`;
      });
    });
    if (list.length > shown) mini += `<span class="mo-more">+${list.length - shown} mais</span>`;
    h += `<div class="mo-cell ${d.getMonth() !== cur.getMonth() ? 'is-other' : ''} ${k === today ? 'is-today' : ''}" data-action="goto-week" data-date="${k}">
      <div class="mo-num">${d.getDate()}</div>
      <div class="mo-list">${mini}</div>
      <div class="mo-dots">${list.slice(0, 6).map(e => `<i style="${catStyle(catKey(e))}"></i>`).join('')}</div>
    </div>`;
  }
  return h + '</div>';
}

/* =====================================================================
   EVENTOS ACOMPANHADOS (somente visão semanal + impressão)
   ===================================================================== */
function followedHTML() {
  const mon = mondayOf(state.cursor);
  const a = iso(mon), b = iso(addDays(mon, 6));
  const all = state.events.filter(e => state.followed.has(e.id)).sort(cmpEv);
  const week = all.filter(e => e.data >= a && e.data <= b);
  let body;
  if (week.length) {
    body = `<p class="summary">${week.length === 1 ? '1 evento acompanhado nesta semana.' : week.length + ' eventos acompanhados nesta semana.'}</p>`
      + gridHTML(mon, week, { detailed: true }) + listHTML(mon, week, { detailed: true });
  } else {
    const prox = all.find(e => e.data > b) || all.slice().reverse().find(e => e.data < a);
    body = `<div class="empty">${icon('star', 30)}
      <h3>Nenhum evento acompanhado nesta semana</h3>
      <p>${all.length
        ? `Você acompanha ${all.length} ${all.length === 1 ? 'evento' : 'eventos'} em outras semanas.`
        : 'No Cronograma, abra um evento e toque em Acompanhar Evento. Ele passa a aparecer aqui.'}</p>
      ${prox ? `<button class="btn" data-action="goto-date" data-date="${prox.data}">Ir para a semana de ${weekShort(mondayOf(parseISO(prox.data)))}</button>`
             : `<button class="btn" data-action="go-tab" data-tab="cronograma">Abrir o cronograma</button>`}
    </div>`;
  }
  return toolbarHTML({ allowMonth: false, canPrint: week.length > 0, canPrintAll: all.some(e => e.data >= iso(new Date())), canCalendar: true, canFollowAllCited: state.session.role !== 'presidente' })
    + printHeadHTML('Eventos Acompanhados', weekLabel(mon))
    + body;
}

// Impressão de TODOS os eventos acompanhados de HOJE em diante (as semanas
// que já passaram não entram). Tudo é ajustado sozinho pra caber numa única
// página A4 em paisagem: a fonte (e o espaçamento, que acompanha a fonte) vai
// diminuindo até caber; se mesmo assim ficar miúdo demais, a tabela é dividida
// em duas ou três, lado a lado, com a mesma formatação.
const MM_PX = 96 / 25.4;
const MARGEM_IMPRESSAO_MM = 7; // igual ao @page
const FOLHA = { larg: (297 - 2 * MARGEM_IMPRESSAO_MM) * MM_PX, alt: (210 - 2 * MARGEM_IMPRESSAO_MM) * MM_PX };
const FOLGA_ALTURA = 0.96; // sobra um pouquinho, porque cada navegador arredonda de um jeito
const FONTE_TABELA = { normal: 9.5, minima: 5, confortavel: 6.5 }; // abaixo de 5px fica ilegível no papel

function linhasImpressaoHTML(weeks) {
  let h = `<table class="print-table"><thead><tr><th>Semana</th><th>Dia</th><th>Horário</th><th>Disciplina</th><th>Título</th><th>Local</th></tr></thead><tbody>`;
  weeks.forEach(([k, evs]) => {
    evs.forEach((e, i) => {
      const d = parseISO(e.data);
      h += `<tr>${i === 0 ? `<td rowspan="${evs.length}">${esc(weekShort(parseISO(k)))}</td>` : ''}`
        + `<td>${WD_SHORT[(d.getDay() + 6) % 7]} ${d.getDate()}/${d.getMonth() + 1}</td>`
        + `<td>${esc(e.inicio)}–${esc(e.fim)}</td><td>${esc(discShort(e))}</td><td>${esc(e.titulo)}</td><td>${esc(e.local || '')}</td></tr>`;
    });
  });
  return h + '</tbody></table>';
}

function printAllHTML(events, colunas) {
  const byWeek = new Map();
  events.slice().sort(cmpEv).forEach(e => { const k = iso(mondayOf(parseISO(e.data))); if (!byWeek.has(k)) byWeek.set(k, []); byWeek.get(k).push(e); });
  const weeks = [...byWeek.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  let h = printHeadHTML('Eventos Acompanhados — de hoje em diante', `${events.length} ${events.length === 1 ? 'evento' : 'eventos'}`);
  const k = Math.min(Math.max(colunas || 1, 1), weeks.length);
  if (k > 1) {
    // semanas inteiras ficam juntas; cada tabela leva mais ou menos a mesma quantidade de eventos
    const grupos = Array.from({ length: k }, () => []);
    let acc = 0;
    weeks.forEach(w => { grupos[Math.min(k - 1, Math.floor(acc / (events.length / k)))].push(w); acc += w[1].length; });
    return h + `<div class="print-cols">${grupos.filter(g => g.length).map(linhasImpressaoHTML).join('')}</div>`;
  }
  return h + linhasImpressaoHTML(weeks);
}

// Mede a folha "escondida" com a largura exata da página impressa e acha o
// maior tamanho de fonte com que ela cabe na altura de UMA página.
function ajustarFonteUmaPagina(sheet) {
  const estiloAntes = sheet.getAttribute('style');
  sheet.style.cssText = `display:block;position:absolute;left:-99999px;top:0;visibility:hidden;width:${FOLHA.larg}px`;
  const tabelas = [...sheet.querySelectorAll('.print-table')];
  const aplicar = px => tabelas.forEach(t => { t.style.fontSize = px + 'px'; });
  const cabe = () => sheet.offsetHeight <= FOLHA.alt * FOLGA_ALTURA;
  let fonte = FONTE_TABELA.normal;
  aplicar(fonte);
  if (!cabe()) {
    let baixo = FONTE_TABELA.minima, alto = FONTE_TABELA.normal;
    aplicar(baixo);
    if (cabe()) {
      for (let i = 0; i < 9; i++) {
        const meio = (baixo + alto) / 2;
        aplicar(meio);
        if (cabe()) baixo = meio; else alto = meio;
      }
    }
    fonte = baixo;
    aplicar(fonte);
  }
  const coube = cabe();
  if (estiloAntes === null) sheet.removeAttribute('style'); else sheet.setAttribute('style', estiloAntes);
  return { fonte, coube };
}

function printAll() {
  const hoje = iso(new Date());
  const all = state.events.filter(e => state.followed.has(e.id) && e.data >= hoje).sort(cmpEv);
  if (!all.length) { toast('Você não acompanha nenhum evento de hoje em diante.'); return; }
  const sheet = $('#print-all');
  // 1 tabela; se a letra ficar miúda demais, tenta 2 e depois 3 lado a lado.
  // Só troca por mais colunas se ganhar bastante (15%+) ou se a anterior nem coubesse.
  let escolhida = null;
  for (const colunas of [1, 2, 3]) {
    sheet.innerHTML = printAllHTML(all, colunas);
    const r = ajustarFonteUmaPagina(sheet);
    const c = { colunas, fonte: r.fonte, coube: r.coube };
    if (!escolhida || (c.coube && !escolhida.coube) || (c.coube === escolhida.coube && c.fonte > escolhida.fonte * 1.15)) escolhida = c;
    if (escolhida.coube && escolhida.fonte >= FONTE_TABELA.confortavel) break;
  }
  if (escolhida.coube) {
    sheet.innerHTML = printAllHTML(all, escolhida.colunas);
    ajustarFonteUmaPagina(sheet);
  } else {
    // nem na menor letra legível cabe numa folha: imprime normal, em quantas páginas precisar
    sheet.innerHTML = printAllHTML(all, 1);
    sheet.querySelectorAll('.print-table').forEach(t => { t.style.fontSize = FONTE_TABELA.normal + 'px'; });
    toast('São eventos demais para uma página só com letra legível — a impressão vai usar mais de uma página.');
  }
  document.body.classList.add('print-all-mode');
  window.print();
}

// Impressão da semana em vista: se a semana estiver cheia demais pra uma
// página, encolhe tudo (zoom) só o necessário. Mede num "molde" invisível com
// a largura da página, já mostrando os detalhes que aparecem no papel.
function ajustarSemanaUmaPagina() {
  const raiz = document.documentElement;
  raiz.style.removeProperty('--print-zoom');
  const wk = $('.wk');
  if (!wk || document.body.classList.contains('print-all-mode')) return;
  const molde = document.createElement('div');
  molde.className = 'print-measure';
  molde.style.cssText = `position:absolute;left:-99999px;top:0;visibility:hidden;width:${FOLHA.larg}px`;
  molde.innerHTML = wk.outerHTML;
  document.body.appendChild(molde);
  const grade = molde.querySelector('.wk');
  // altura da grade com um certo zoom (ao dar zoom o texto reorganiza e quebra
  // menos linhas, então precisa medir COM o zoom, não estimar por regra de três)
  const alturaCom = z => { grade.style.zoom = String(z); return molde.offsetHeight; };
  const disponivel = FOLHA.alt * FOLGA_ALTURA - 72; // ~72px são o título impresso da semana
  let zoom = 1;
  if (alturaCom(1) > disponivel) {
    let baixo = 0.3, alto = 1;
    if (alturaCom(baixo) > disponivel) zoom = baixo;
    else {
      for (let i = 0; i < 9; i++) {
        const meio = (baixo + alto) / 2;
        if (alturaCom(meio) <= disponivel) baixo = meio; else alto = meio;
      }
      zoom = baixo;
    }
  }
  molde.remove();
  if (zoom < 1) raiz.style.setProperty('--print-zoom', String(zoom));
}
function imprimirSemana() { ajustarSemanaUmaPagina(); window.print(); }

window.addEventListener('beforeprint', ajustarSemanaUmaPagina); // também vale pra Ctrl+P
window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-all-mode');
  document.documentElement.style.removeProperty('--print-zoom');
});

/* ---------- assinatura de calendário (Google Calendar / Apple / Outlook) ---------- */
/* ---------- instalar como aplicativo (Android/Chrome e iOS/Safari) ----------
   Android/Chrome/Edge disparam sozinhos o evento "beforeinstallprompt"
   quando o site cumpre os critérios de instalação (manifest.json + ícones +
   HTTPS + Service Worker, tudo já configurado neste projeto) — a gente só
   guarda esse evento e mostra um botão próprio pra disparar o prompt nativo
   na hora que a pessoa quiser. iOS/Safari não dispara esse evento (a Apple
   não oferece essa API); por isso lá sempre mostramos o botão com o passo a
   passo manual (Compartilhar ▸ Adicionar à Tela de Início). */
let deferredInstallPrompt = null;
const estaStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
function podeMostrarInstalar() {
  return !IS_DEMO && !estaStandalone() && !!state.session && (!!deferredInstallPrompt || ehIOS());
}

function inserirBotaoInstalar() {
  if (!state.session || estaStandalone() || document.querySelector('.install-btn')) return;
  const ref = document.querySelector('.notif-btn') || document.querySelector('[data-action="abrir-busca"]');
  if (ref) ref.insertAdjacentHTML('beforebegin', `<button class="icon-btn line install-btn" data-action="install-app" title="Instalar aplicativo" aria-label="Instalar aplicativo">${icon('download', 16)}</button>`);
}
window.addEventListener('beforeinstallprompt', (ev) => {
  ev.preventDefault();
  deferredInstallPrompt = ev;
  inserirBotaoInstalar();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = document.querySelector('.install-btn');
  if (btn) btn.remove();
  toast('Aplicativo instalado.');
});

async function installApp() {
  if (deferredInstallPrompt) {
    const ev = deferredInstallPrompt;
    deferredInstallPrompt = null;
    ev.prompt();
    try { await ev.userChoice; } catch (e) { /* nada a fazer */ }
    return;
  }
  openModal(`
    <div class="modal-head">
      <h2>Instalar como aplicativo</h2>
      <button type="button" class="icon-btn" data-action="close-modal" aria-label="Fechar">${icon('x', 18)}</button>
    </div>
    <div class="sec" style="margin-top:0;padding-top:0;border-top:none">
      <h4>iPhone/iPad (Safari)</h4>
      <p style="margin-bottom:8px">1. Toque no ícone de Compartilhar ${icon('share', 14)} na barra do navegador.</p>
      <p>2. Role a lista e toque em <b>"Adicionar à Tela de Início"</b>.</p>
    </div>
    <div class="sec"><h4>Android (Chrome)</h4>
      <p>Toque no menu <b>⋮</b> no canto superior e escolha <b>"Instalar aplicativo"</b> (ou "Adicionar à tela inicial").</p>
    </div>
    <div class="sec"><h4>Computador (Chrome/Edge)</h4>
      <p>Clique no ícone de instalação que aparece do lado direito da barra de endereço.</p>
    </div>
  `, 'instalar-app');
}

function icsUrlFor(usuario) {
  if (!CONFIG.ICS_URL) return '';
  const base = CONFIG.ICS_URL;
  return base + (base.indexOf('?') >= 0 ? '&' : '?') + 'usuario=' + encodeURIComponent(usuario);
}

// "De um clique": o Google Calendar tem uma URL própria que já abre a tela
// de confirmação de assinatura com o link preenchido (cid = a URL do .ics).
// No iPhone/iPad/Mac, troca "https://" por "webcal://" e o próprio sistema
// reconhece o link e oferece "Assinar" direto, sem precisar copiar/colar
// nada em Ajustes — é o jeito mais direto que existe fora de um app nativo.
function googleCalendarSubscribeUrl(icsUrl) {
  return 'https://calendar.google.com/calendar/u/0/r?cid=' + encodeURIComponent(icsUrl);
}
function webcalUrl(icsUrl) {
  return icsUrl.replace(/^https?:\/\//, 'webcal://');
}

      : 'Mostra só os eventos que você marcou em "Acompanhar Evento". Assine uma vez e sua agenda atualiza sozinha sempre que você seguir ou deixar de seguir algo — com lembrete automático de 1 dia, 1 hora e 30 minutos antes (Apple Calendar/Outlook).'}</p>

/* ---------- notificações no app (mural, eventos acompanhados, alterações) ----------
   Login persistente de verdade: o Firebase Auth guarda a sessão sozinho no
   aparelho (não depende mais de um link pessoal por usuário — ver
   onAuthStateChanged, mais abaixo). As notificações abaixo são o novo
   recurso pedido: cada discente recebe, aqui dentro do app, um aviso
   sempre que (1) sai um novo aviso no mural, (2) um evento que ele
   acompanha muda de horário/sala/é cancelado, ou (3) uma nota é lançada —
   gravadas pela Cloud Function em notificacoes/{usuario}/itens (ver
   functions/index.js). */
let unsubscribeNotificacoes = null;

let notificacoesPrimeiraLeitura = true;
function iniciarNotificacoes() {
  if (IS_DEMO || !state.session || !window.Firebase) return;
  pararNotificacoes();
  notificacoesPrimeiraLeitura = true;
  pedirPermissaoNotificacao();
  const u = state.session.usuario;
  const ref = window.Firebase.query(
    window.Firebase.collection(window.Firebase.db, 'notificacoes', u, 'itens'),
    window.Firebase.orderBy('criadoEm', 'desc'), window.Firebase.limit(30));
  unsubscribeNotificacoes = window.Firebase.onSnapshot(ref, snap => {
    state.notificacoes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.notifNaoLidas = state.notificacoes.filter(n => !n.lida).length;
    const btn = document.querySelector('.notif-btn');
    if (btn) btn.outerHTML = `<button class="icon-btn line notif-btn" data-action="notificacoes" title="Notificações" aria-label="Notificações">${icon('bell', 16)}${state.notifNaoLidas ? `<span class="notif-badge">${state.notifNaoLidas > 9 ? '9+' : state.notifNaoLidas}</span>` : ''}</button>`;
    if (state.modal === 'notificacoes') abrirNotificacoes(true);
    // Só manda notificação do sistema (banner no celular) pra quem chegou
    // DEPOIS da primeira leitura — senão, toda vez que o site abre, ele
    // "notificaria" de novo as últimas 30 notificações antigas.
    if (!notificacoesPrimeiraLeitura) {
      snap.docChanges().filter(c => c.type === 'added').forEach(c => {
        const n = c.doc.data();
        mostrarNotificacaoDoSistema(n.titulo, n.corpo);
      });
    }
    notificacoesPrimeiraLeitura = false;
  }, () => { /* sem permissão ainda (ex.: acabou de deslogar) — ignora */ });
}

// Pede permissão do navegador pra mostrar notificações do sistema (o banner
// que aparece mesmo com o site em segundo plano/minimizado). Só funciona
// enquanto o site/app estiver aberto (ou aberto em segundo plano) no
// aparelho — não existe um servidor mandando push pra quem fechou tudo.
function pedirPermissaoNotificacao() {
  try {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') Notification.requestPermission().then(registrarPush).catch(() => {});
    else registrarPush();
  } catch (err) { /* ignora — não é essencial pro resto do site funcionar */ }
}

async function mostrarNotificacaoDoSistema(titulo, corpo) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (navigator.serviceWorker) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) { await reg.showNotification(titulo || 'Cronograma Acadêmico', { body: corpo || '', icon: 'icon-192.png', badge: 'icon-192.png' }); return; }
    }
    new Notification(titulo || 'Cronograma Acadêmico', { body: corpo || '' });
  } catch (err) { /* navegador sem suporte, ou permissão negada — ignora */ }
}

/* ---------- Push de verdade (FCM) — chega com o app fechado ----------
   Guarda o token do aparelho em pushTokens/{sha256(token)} com o usuário
   dono; o Worker da Cloudflare (push-worker/)
   lê essa coleção e dispara o push quando surge uma notificação nova. */
const PUSH_KEY = 'cron.pushDoc';
function pushSuportado() {
  return !IS_DEMO && !!CONFIG.VAPID_KEY && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window && location.protocol !== 'file:';
}
async function registrarPush() {
  try {
    if (!pushSuportado() || !state.session || Notification.permission !== 'granted') return;
    const F = await waitFirebase();
    const M = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js');
    if (!(await M.isSupported())) return;
    const reg = await navigator.serviceWorker.ready;
    const token = await M.getToken(M.getMessaging(F.app), { vapidKey: CONFIG.VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) return;
    const id = await sha256Hex(token);
    await F.setDoc(F.doc(F.db, 'pushTokens', id), {
      token, usuario: state.session.usuario, atualizadoEm: new Date().toISOString(),
      plataforma: (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '',
      standalone: estaStandalone(),
    });
    store.set(PUSH_KEY, id);
  } catch (err) { /* sem push neste aparelho — o resto do app segue normal */ }
}
function desregistrarPush() {
  try {
    const id = store.get(PUSH_KEY); if (!id || !window.Firebase) return;
    store.del(PUSH_KEY);
    window.Firebase.deleteDoc(window.Firebase.doc(window.Firebase.db, 'pushTokens', id)).catch(() => {});
  } catch (err) { /* ignora */ }
}
async function ativarPush() {
  try {
    if (!('Notification' in window)) { toast('Este navegador não suporta notificações.'); return; }
    if (ehIOS() && !estaStandalone()) { toast('No iPhone, instale o app (Compartilhar ▸ Adicionar à Tela de Início) e abra por lá.'); return; }
    const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notificações bloqueadas. Libere nas configurações do navegador/aparelho.'); return; }
    await registrarPush();
    toast('Notificações ativadas neste aparelho.');
    if (state.modal === 'notificacoes') abrirNotificacoes(true);
  } catch (err) { toast('Não foi possível ativar as notificações.'); }
}

function pararNotificacoes() {
  if (unsubscribeNotificacoes) { unsubscribeNotificacoes(); unsubscribeNotificacoes = null; }
  state.notificacoes = []; state.notifNaoLidas = 0;
}

function tempoRelativo(iso) {
  const d = typeof iso === 'string' ? new Date(iso) : (iso && iso.toDate ? iso.toDate() : new Date());
  const seg = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
  if (seg < 60) return 'agora mesmo';
  if (seg < 3600) return Math.round(seg / 60) + ' min atrás';
  if (seg < 86400) return Math.round(seg / 3600) + ' h atrás';
  return Math.round(seg / 86400) + ' d atrás';
}

async function marcarNotificacaoLida(id) {
  const n = (state.notificacoes || []).find(x => x.id === id);
  if (!n || n.lida || IS_DEMO || !window.Firebase) return;
  n.lida = true;
  try { await window.Firebase.updateDoc(window.Firebase.doc(window.Firebase.db, 'notificacoes', state.session.usuario, 'itens', id), { lida: true }); } catch (e) { /* tenta de novo na próxima sincronização */ }
}

async function marcarTodasNotificacoesLidas() {
  if (IS_DEMO || !window.Firebase) return;
  const pendentes = (state.notificacoes || []).filter(n => !n.lida);
  pendentes.forEach(n => { n.lida = true; });
  try {
    const batch = window.Firebase.writeBatch(window.Firebase.db);
    pendentes.forEach(n => batch.update(window.Firebase.doc(window.Firebase.db, 'notificacoes', state.session.usuario, 'itens', n.id), { lida: true }));
    await batch.commit();
    toast('Notificações marcadas como lidas.');
    abrirNotificacoes(true);
  } catch (e) { toast('Não foi possível marcar como lidas agora.', 'err'); }
}

/* ---------- "Acompanhar Todos os eventos que estou Citado" ---------- */
async function followAllCited() {
  if (!state.session || state.session.role === 'presidente') return;
  const alvos = state.events.filter(e => estouNesseEvento(e) && !state.followed.has(e.id));
  if (!alvos.length) { toast('Nenhum evento novo em que você está citado.'); return; }
  const idsOriginais = new Set(state.followed);
  alvos.forEach(e => state.followed.add(e.id));
  state.pending++; saveCache(); refreshUI();
  try {
    if (IS_DEMO || !window.Firebase) {
      for (const e of alvos) await Backend.follow(state.session.usuario, e.id, true);
    } else {
      const u = state.session.usuario;
      const batch = window.Firebase.writeBatch(window.Firebase.db);
      alvos.forEach(e => batch.set(window.Firebase.doc(window.Firebase.db, 'acompanhados', u + '_' + e.id), { usuario: u, eventoId: e.id }));
      await batch.commit();
    }
    toast(alvos.length === 1 ? '1 evento adicionado aos Eventos Acompanhados.' : alvos.length + ' eventos adicionados aos Eventos Acompanhados.');
  } catch (e) {
    state.followed = idsOriginais; saveCache(); refreshUI();
    if (!handleApiError(e)) toast(e.message || 'Não foi possível salvar. Tente de novo.', 'err');
  } finally {
    state.pending--; saveCache(); refreshUI();
  }
}

/* ---------- busca única (eventos + arquivos + mural) ---------- */
// Ignora acento/caixa pra achar "habilidades" mesmo se a pessoa digitar
// "habilidádes" ou "HABILIDADES" — tudo comparado no mesmo "alfabeto".
const dobraAcento = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function buscarTudo(termoOriginal) {
  const termo = dobraAcento(termoOriginal);
  const eventos = state.events.filter(e => dobraAcento([e.titulo, e.disciplina, e.eixo, e.local, e.docente, e.observacoes, e.grupo].join(' ')).indexOf(termo) >= 0);
  const arquivos = state.arquivos.filter(a => dobraAcento([a.titulo, a.disciplina, a.tipo, a.docente, a.modulo].join(' ')).indexOf(termo) >= 0);
  const avisos = state.mural.filter(m => dobraAcento(m.texto).indexOf(termo) >= 0);
  return { eventos, arquivos, avisos };
}

/* =====================================================================
   HISTÓRICO (presidente)
   ===================================================================== */
function historyHTML() {
  const map = new Map();
  state.events.forEach(e => {
    const k = iso(mondayOf(parseISO(e.data)));
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(e);
  });
  const weeks = [...map.entries()].sort((x, y) => y[0].localeCompare(x[0]));
  const thisMon = iso(mondayOf(new Date()));
  let h = `<div class="toolbar no-print"><h1 class="range" style="margin-left:0">Histórico de semanas</h1></div>
    <p class="lead">Cada semana publicada fica guardada aqui. Abra uma semana para revisar, editar ou imprimir.</p>`;
  if (!weeks.length) {
    return h + `<div class="empty">${icon('calendar', 30)}<h3>Nenhuma semana publicada ainda</h3><p>Crie o primeiro evento no Cronograma para começar o histórico.</p><button class="btn primary" data-action="go-tab" data-tab="cronograma">Ir para o Cronograma</button></div>`;
  }
  let lastMonth = '';
  weeks.forEach(([k, evs]) => {
    const mon = parseISO(k);
    const m = capitalize(MESES[mon.getMonth()]) + ' de ' + mon.getFullYear();
    if (m !== lastMonth) { if (lastMonth) h += '</div>'; h += `<h3 class="hist-month">${m}</h3><div class="hist-list">`; lastMonth = m; }
    const counts = {};
    evs.forEach(e => { const k = catKey(e); counts[k] = (counts[k] || 0) + 1; });
    const chips = categorias().filter(({ key }) => counts[key])
      .map(({ key, label }) => `<span class="chip" style="${catStyle(key)}">${esc(label)} ${counts[key]}</span>`).join('');
    h += `<div class="hist-row">
      <div class="hist-week"><b>${weekShort(mon)}${k === thisMon ? '<span class="now-tag">Esta semana</span>' : ''}</b><span>${mon.getFullYear()}</span></div>
      <div class="hist-chips">${chips}</div>
      <div class="hist-count">${evs.length} ${evs.length === 1 ? 'evento' : 'eventos'}</div>
      <div class="hist-actions">
        <button class="btn sm" data-action="hist-open" data-date="${k}">Abrir</button>
        <button class="btn sm ghost" data-action="hist-print" data-date="${k}" aria-label="Imprimir semana">${icon('printer', 15)}</button>
      </div>
    </div>`;
  });
  return h + '</div>';
}

/* =====================================================================
   MURAL DE AVISOS
   Publicado só pelo presidente, quando ele decide — não é gerado sozinho a
   cada alteração. Cada aviso pode citar um evento e/ou um arquivo.
   ===================================================================== */
const eventoLabel = e => { const d = parseISO(e.data); return `${e.titulo} — ${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${e.inicio}`; };
const arquivoLabel = a => `${a.titulo} (${a.tipo})`;

function dataHoraCurta(isoStr) {
  const d = new Date(isoStr);
  if (isNaN(d)) return '';
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Preenche os campos que um aviso mais antigo (de antes de existir enquete,
// ou salvo em cache antes dessa versão) pode não ter, pra nunca quebrar o
// resto do código por falta de um campo.
function normalizarAviso(m) {
  return Object.assign({ lidoPor: [], eventoIds: [], arquivoIds: [], opcoes: [], multiplaEscolha: 'Não', votos: [], meuVoto: [], votantes: [] }, m);
}

function muralCitacaoHTML(m) {
  let h = '';
  (m.eventoIds || []).forEach(id => {
    const e = state.events.find(x => x.id === id);
    h += e
      ? `<button class="mural-cita" style="${catStyle(catKey(e))}" data-action="open-event" data-id="${esc(e.id)}">${icon('calendar', 13)}<span>${esc(eventoLabel(e))}${e.cancelado === 'Sim' ? ' — cancelado' : ''}</span></button>`
      : `<span class="mural-cita is-off">${icon('calendar', 13)}<span>Evento citado não existe mais</span></span>`;
  });
  (m.arquivoIds || []).forEach(id => {
    const a = state.arquivos.find(x => x.id === id);
    h += a
      ? `<a class="mural-cita" href="${esc(a.pdfUrl || a.downloadUrl || a.abrirUrl)}" target="_blank" rel="noopener noreferrer">${icon('paperclip', 13)}<span>${esc(arquivoLabel(a))}</span></a>`
      : `<span class="mural-cita is-off">${icon('paperclip', 13)}<span>Arquivo citado não existe mais</span></span>`;
  });
  return h;
}

function enqueteHTML(m, isP) {
  const total = m.votos.reduce((s, v) => s + v, 0);
  return `<div class="enquete">
    ${m.opcoes.map((texto, i) => {

        <span class="enquete-barra" style="width:${pct}%"></span>
        <span class="enquete-linha">
          <span class="enquete-check">${marcado ? icon('star', 13, true) : ''}</span>
          <span class="enquete-texto">${esc(texto)}</span>
          <span class="enquete-n">${n}</span>
        </span>
      </button>`;
    }).join('')}
    <p class="hint" style="margin-top:6px">${total} ${total === 1 ? 'voto' : 'votos'}${m.multiplaEscolha === 'Sim' ? ' · pode escolher mais de uma opção' : ''}</p>

// Marca como lido (pro discente) tudo que ainda não foi marcado, assim que
// o mural é exibido na tela — sem precisar de nenhum clique extra.
function marcarMuralComoLido() {
  if (!state.session || state.session.role === 'presidente') return;
  const usuario = state.session.usuario;
  const pendentes = state.mural.filter(m => (m.lidoPor || []).indexOf(usuario) < 0);
  if (!pendentes.length) return;
  pendentes.forEach(m => { if (!m.lidoPor) m.lidoPor = []; m.lidoPor.push(usuario); });
  saveCache();
  pendentes.forEach(m => { Backend.marcarLido(usuario, m.id).catch(() => {}); });
}

/* =====================================================================
   DATAS IMPORTANTES
   ===================================================================== */
function contagemRegressiva(dataISO) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const alvo = parseISO(dataISO);
  const dias = Math.round((alvo - hoje) / 86400000);
  if (dias === 0) return { texto: 'É hoje', classe: 'hoje' };
  if (dias === 1) return { texto: 'Amanhã', classe: 'breve' };
  if (dias > 1) return { texto: `Faltam ${dias} dias`, classe: dias <= 7 ? 'breve' : '' };
  if (dias === -1) return { texto: 'Foi ontem', classe: 'passou' };
  return { texto: `Há ${-dias} dias`, classe: 'passou' };
}

function dataItemHTML(item, isP) {
  const cont = contagemRegressiva(item.data);
  const d = parseISO(item.data);
  const cor = CORES_DATA[item.categoria] || CORES_DATA.Outras;
  return `<div class="data-item ${cont.classe}">
    <div class="data-dia" style="--c:${darken(cor, 0.5)};--cb:${cor}"><span class="data-num">${pad(d.getDate())}</span><span class="data-mes">${MES_ABR[d.getMonth()]}</span></div>
    <div class="data-info">
      <span class="chip" style="--c:${darken(cor, 0.5)};--cb:${cor}">${esc(item.categoria)}</span>
      <span class="data-titulo">${esc(item.titulo)}</span>
      ${item.observacoes ? `<span class="data-obs">${linkify(item.observacoes)}</span>` : ''}
    </div>
    <div class="data-contagem">${cont.texto}</div>
    ${isP ? `<div class="data-acoes">
      <button class="icon-btn" data-action="edit-data" data-id="${esc(item.id)}" aria-label="Editar">${icon('edit', 15)}</button>
      <button class="icon-btn" data-action="delete-data" data-id="${esc(item.id)}" aria-label="Excluir">${icon('trash', 15)}</button>
    </div>` : ''}
  </div>`;
}

function datasHTML(isP) {
  let h = `<div class="toolbar no-print">
    <h1 class="range" style="margin-left:0">Datas Importantes</h1>
    <div class="spacer"></div>
    ${isP ? `<button class="btn primary" data-action="new-data">${icon('plus', 16)} Nova data</button>` : ''}
  </div>`;
  if (!state.datas.length) {
    return h + `<div class="empty">${icon('calendar', 30)}<h3>Nenhuma data cadastrada</h3><p>${isP ? 'Cadastre provas, prazos de entrega ou outras datas importantes — todo mundo vê a contagem regressiva.' : 'O presidente ainda não cadastrou nenhuma data importante.'}</p></div>`;
  }
  const hojeISO = iso(new Date());
  const proximas = state.datas.filter(x => x.data >= hojeISO);
  const passadas = state.datas.filter(x => x.data < hojeISO).slice().sort((a, b) => b.data.localeCompare(a.data));
  h += `<p class="lead">Provas, prazos e outras datas que valem a pena não esquecer.</p>`;
  if (proximas.length) {
    h += `<div class="data-list">${proximas.map(x => dataItemHTML(x, isP)).join('')}</div>`;
  } else {
    h += `<p class="muted" style="margin:4px 0 16px">Nenhuma data futura cadastrada no momento.</p>`;
  }
  if (passadas.length) {
    h += `<details class="data-passadas"><summary>${passadas.length} ${passadas.length === 1 ? 'data já passou' : 'datas já passaram'}</summary>
      <div class="data-list" style="margin-top:12px">${passadas.map(x => dataItemHTML(x, isP)).join('')}</div>
    </details>`;
  }
  return h;
}

/* =====================================================================
   NOTAS (discente) · ENVIO DE NOTAS E DISCENTES (presidente)
   A planilha chama essa aba de "Avaliacoes" por baixo dos panos (pra não se
   confundir com a aba "Notas" que já existia, de anotações privadas por
   evento) — pro discente e pro presidente, ela aparece como "Notas" e
   "Envio de Notas", exatamente como foi pedido.

function fmtNota(n) {
  const v = Number(n);
  if (isNaN(v)) return String(n == null ? '' : n);
  return (Math.round(v * 100) / 100).toString().replace('.', ',');
}
const notaConvertida10 = (nota, notaMaxima) => { const m = Number(notaMaxima); return m ? Number(nota) * 10 / m : Number(nota); };

/* ---------- presidente: lançamento em LOTE (a turma toda, ou só T1/T2, de uma vez) ----------
   Escolhe disciplina/eixo/tipo/escala UMA vez só; aparece um campinho de nota por
   discente (filtrável por grupo de tutoria) e tudo é enviado junto num só clique.
   Segue o mesmo padrão de "capturar o que já foi digitado antes de redesenhar"
   usado no formulário do Mural (ver muCapturarEstadoDoDOM). */
let loteDisciplina = DISCIPLINAS[0], loteEixo = '', loteModulo = '', loteTipo = TIPOS_AVALIACAO[0], loteMax = '10', loteGrupo = 'TODOS';
let loteValores = {}; // usuario -> texto digitado no campinho de nota

// A que grupo de tutoria (T1/T2) um discente pertence, comparando o nome
// cadastrado na aba Discentes com as listas de TUTORIAS — tolerante a
// acento/maiúscula/nome incompleto, igual ao "estou nesse evento".
function grupoTutoriaDoDiscente(d) {
  const nomeTokens = tokensDeNome(d.nome || d.usuario || '');
  if (!nomeTokens.length) return null;
  if ((TUTORIAS.T1 || []).some(n => mesmoNome(tokensDeNome(n), nomeTokens))) return 'T1';
  if ((TUTORIAS.T2 || []).some(n => mesmoNome(tokensDeNome(n), nomeTokens))) return 'T2';
  return null;
}

function discentesFiltradosPorGrupo(grupo) {
  const lista = discentesOrdenados();
  if (!grupo || grupo === 'TODOS') return lista;
  return lista.filter(d => grupoTutoriaDoDiscente(d) === grupo);
}

// Avaliação já lançada pra esse discente, na mesma disciplina+eixo+módulo+
// tipo+escala escolhida no formulário — é o que faz o lote servir também
// pra EDITAR em massa um lançamento já feito, não só criar um novo.
function achaAvaliacaoDoLote(usuario, disciplina, eixo, modulo, tipo, notaMaxima) {
  return state.avaliacoes.find(a => a.usuario === usuario && a.disciplina === disciplina
    && (a.eixo || '') === (eixo || '') && (a.modulo || '') === (modulo || '') && a.tipo === tipo && String(a.notaMaxima) === String(notaMaxima));
}

// Repreenche loteValores com o que já está lançado para a combinação atual
// (disciplina/eixo/módulo/tipo/escala) — chamado sempre que uma dessas
// muda, pra reabrir o lote de lançamento como edição em massa.
function loteRecarregarValores() {
  loteValores = {};
  discentesOrdenados().forEach(d => {
    const a = achaAvaliacaoDoLote(d.usuario, loteDisciplina, loteEixo, loteModulo, loteTipo, loteMax);
    if (a) loteValores[d.usuario] = fmtNota(a.nota);
  });
}

function loteCapturarEstadoDoDOM() {
  document.querySelectorAll('[data-lote-nota]').forEach(el => { loteValores[el.dataset.loteNota] = el.value; });
  const m = $('#lf-modulo');
  if (m) loteModulo = m.value.trim();
}

function loteLinhaHTML(d) {
  const grupo = grupoTutoriaDoDiscente(d);
  const existente = achaAvaliacaoDoLote(d.usuario, loteDisciplina, loteEixo, loteModulo, loteTipo, loteMax);
  const val = loteValores[d.usuario] !== undefined ? loteValores[d.usuario] : '';
  return `<div class="lote-row">
    <span class="lote-nome">${esc(d.nome || d.usuario)}${grupo ? ` <span class="muted">· ${esc(grupo)}</span>` : ''}</span>

}

function loteGridHTML() {
  const lista = discentesFiltradosPorGrupo(loteGrupo);
  if (!lista.length) return `<p class="muted">Nenhum discente nesse grupo.</p>`;

async function submitLoteForm(form) {
  const fd = new FormData(form);
  const disciplina = fd.get('disciplina');
  const eixo = disciplina === DISC_HAB ? (fd.get('eixo') || '') : '';
  const tipo = fd.get('tipo');
  const notaMaxima = fd.get('notaMaxima');
  const precisaModulo = precisaModuloAvaliacao(disciplina, tipo);
  const modulo = precisaModulo ? (fd.get('modulo') || '').trim() : '';
  const errEl = $('#lf-err');
  if (disciplina === DISC_HAB && !eixo) { errEl.textContent = 'Escolha o eixo de Habilidades Profissionais.'; errEl.hidden = false; return; }
  if (precisaModulo && !modulo) { errEl.textContent = 'Informe o módulo.'; errEl.hidden = false; return; }

  loteCapturarEstadoDoDOM();
  const maxNum = Number(notaMaxima);
  const itens = [];
  const erros = [];
  discentesFiltradosPorGrupo(loteGrupo).forEach(d => {
    const bruto = (loteValores[d.usuario] || '').trim();
    if (!bruto) return;
    const n = Number(bruto.replace(',', '.'));
    if (isNaN(n) || n < 0 || n > maxNum) { erros.push((d.nome || d.usuario) + ': nota inválida.'); return; }
    const existente = achaAvaliacaoDoLote(d.usuario, disciplina, eixo, modulo, tipo, notaMaxima);
    itens.push({ usuario: d.usuario, nota: String(n), id: existente ? existente.id : '' });
  });
  if (erros.length) { errEl.textContent = erros.join(' '); errEl.hidden = false; return; }
  if (!itens.length) { errEl.textContent = 'Digite ao menos uma nota para salvar.'; errEl.hidden = false; return; }
  errEl.hidden = true;

  const btn = $('[data-action="submit-lote-form"]');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    const r = await Backend.saveAvaliacoesEmLote(state.session.token, { disciplina, eixo, modulo, tipo, notaMaxima, itens });
    (r.avaliacoes || []).forEach(saved => {
      const i = state.avaliacoes.findIndex(x => x.id === saved.id);
      if (i >= 0) state.avaliacoes[i] = saved; else state.avaliacoes.push(saved);
    });
    if (r.versionAvaliacoes) state.versionAvaliacoes = r.versionAvaliacoes;
    saveCache();
    closeModal();
    state.tab = 'notas';
    renderView();
    toast(itens.length === 1 ? 'Nota salva.' : itens.length + ' notas salvas.');
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    if (handleApiError(e)) return;
    errEl.textContent = e.message || 'Não foi possível salvar.'; errEl.hidden = false;
  }
}

      <div class="field"><label for="nf-max">Nota máxima (peso)</label>
        <select class="select" id="nf-max" name="notaMaxima">${NOTAS_MAXIMAS_VALIDAS.map(m => opt(m, 'de ' + m, String(m) === String(v.notaMaxima))).join('')}</select></div>

    <div class="field"><label for="nf-nota">Nota obtida</label>
      <input class="input" id="nf-nota" name="nota" value="${esc(v.nota !== '' && v.nota != null ? String(v.nota).replace('.', ',') : '')}" placeholder="Ex.: 5,4" inputmode="decimal"></div>

async function submitNotaForm(form) {
  const fd = new FormData(form);
  const a = {
    id: fd.get('id') || '',
    usuario: fd.get('usuario') || '',
    disciplina: fd.get('disciplina'),
    eixo: fd.get('eixo') || '',
    modulo: (fd.get('modulo') || '').trim(),
    tipo: fd.get('tipo'),
    notaMaxima: fd.get('notaMaxima'),
    nota: (fd.get('nota') || '').trim(),
  };
  const errEl = $('#nf-err');
  const errs = [];
  if (!a.usuario) errs.push('Selecione o discente.');
  if (a.disciplina === DISC_HAB && !a.eixo) errs.push('Escolha o eixo de Habilidades Profissionais.');
  const precisaModulo = precisaModuloAvaliacao(a.disciplina, a.tipo);
  if (precisaModulo && !a.modulo) errs.push('Informe o módulo.');
  const notaNum = Number(a.nota.replace(',', '.'));
  const maxNum = Number(a.notaMaxima);
  if (!a.nota || isNaN(notaNum)) errs.push('Informe a nota obtida.');
  else if (notaNum < 0 || notaNum > maxNum) errs.push('A nota não pode ser maior que ' + fmtNota(maxNum) + '.');
  if (errs.length) { errEl.textContent = errs.join(' '); errEl.hidden = false; return; }
  errEl.hidden = true;
  if (a.disciplina !== DISC_HAB) a.eixo = '';
  if (!precisaModulo) a.modulo = '';

  const btn = $('[data-action="submit-nota-form"]');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    const r = await Backend.saveAvaliacao(state.session.token, a);
    const saved = r.avaliacao;
    const i = state.avaliacoes.findIndex(x => x.id === saved.id);
    if (i >= 0) state.avaliacoes[i] = saved; else state.avaliacoes.push(saved);
    if (r.versionAvaliacoes) state.versionAvaliacoes = r.versionAvaliacoes;
    saveCache();
    closeModal();
    state.tab = 'notas';
    renderView();
    toast('Nota salva.');
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    if (handleApiError(e)) return;
    errEl.textContent = e.message || 'Não foi possível salvar.'; errEl.hidden = false;
  }
}

async function removeNota(id) {
  const a = state.avaliacoes.find(x => x.id === id);
  if (!(await confirmar('Excluir esta nota?'))) return;
  try {
    const r = await Backend.deleteAvaliacao(state.session.token, id);
    state.avaliacoes = state.avaliacoes.filter(x => x.id !== id);
    if (r.versionAvaliacoes) state.versionAvaliacoes = r.versionAvaliacoes;
    saveCache();
    if (a && state.modal === 'notas-discente:' + a.usuario) renderNotasDiscenteModal(a.usuario);
    else closeModal();
    renderView();
    toast('Nota excluída.');
  } catch (e) {
    if (!handleApiError(e)) toast(e.message || 'Não foi possível excluir.', 'err');
  }
}

let semWizard = null;

function nomeDoGrupo(mapaGrupos, nome) {
  return Object.keys(mapaGrupos).find(k => (mapaGrupos[k] || []).some(n => n === nome)) || '';
}

function abrirEncerrarSemestre() {
  semWizard = {
    passo: 'intro',
    rotulo: '',
    eixos: EIXOS.map(titulo => ({ titulo, docentes: (DOCENTES_EIXOS[titulo] || []).join(', ') })),
    tutoria: {}, // nome -> 'T1' | 'T2'
    hp: {},      // nome -> 'A' | 'B' | 'C' | 'D'
  };
  TODOS_ALFABETICA.forEach(nome => {
    semWizard.tutoria[nome] = nomeDoGrupo(TUTORIAS, nome) || 'T1';
    semWizard.hp[nome] = nomeDoGrupo(SUBGRUPOS, nome) || 'A';
  });
  reRenderSemWizard();
}

function reRenderSemWizard() {
  openModal(semWizardHTML(), 'semwizard', 'semwizard');

}

  if (semWizard.passo === 'eixos') return semWizardEixosHTML();

async function semConfirmarFinal() {
  semCapturarGruposDoDOM();
  const config = {
    eixos: semWizard.eixos.map(o => o.titulo.trim()).filter(Boolean),
    docentesEixos: Object.fromEntries(semWizard.eixos.filter(o => o.titulo.trim()).map(o => [o.titulo.trim(), o.docentes.split(',').map(s => s.trim()).filter(Boolean)])),
    tutorias: { T1: TODOS_ALFABETICA.filter(n => semWizard.tutoria[n] === 'T1'), T2: TODOS_ALFABETICA.filter(n => semWizard.tutoria[n] === 'T2') },
    subgrupos: { A: TODOS_ALFABETICA.filter(n => semWizard.hp[n] === 'A'), B: TODOS_ALFABETICA.filter(n => semWizard.hp[n] === 'B'), C: TODOS_ALFABETICA.filter(n => semWizard.hp[n] === 'C'), D: TODOS_ALFABETICA.filter(n => semWizard.hp[n] === 'D') },
  };
  const errEl = $('#sem-err');
  if (!config.tutorias.T1.length || !config.tutorias.T2.length) { if (errEl) { errEl.textContent = 'Os dois grupos de tutoria (T1 e T2) precisam ter pelo menos um discente.'; errEl.hidden = false; } return; }
  if (!config.subgrupos.A.length || !config.subgrupos.B.length || !config.subgrupos.C.length || !config.subgrupos.D.length) { if (errEl) { errEl.textContent = 'Os quatro subgrupos de HP (A, B, C e D) precisam ter pelo menos um discente.'; errEl.hidden = false; } return; }
  const ok = await confirmar(`Encerrar o semestre "${semWizard.rotulo}" agora? O cronograma, o mural, os arquivos e as datas importantes atuais serão arquivados e substituídos pelos grupos novos. Isso só deve ser feito uma vez, ao final do semestre.`, 'Encerrar semestre');
  if (!ok) return;
  const btn = $('[data-action="sem-confirmar-final"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Encerrando…'; }
  try {
    await Backend.encerrarSemestre(state.session.token, semWizard.rotulo);
    await Backend.salvarConfiguracaoSemestre(state.session.token, config);
    aplicarConfiguracao(config);
    semWizard = null;
    closeModal();
    await sync({ force: true, silent: false });
    renderView();
    toast('Semestre encerrado. Grupos e eixos novos já estão em vigor.');
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Encerrar e salvar'; }
    if (!handleApiError(e)) {
      const err = $('#sem-err');
      if (err) { err.textContent = e.message || 'Não foi possível encerrar o semestre.'; err.hidden = false; }
    }
  }
}

// Confirmação feita pelo PRÓPRIO site, em vez da janelinha nativa do navegador.
// O navegador simplesmente ignora essa janelinha quando o site roda dentro de um
// iframe "sandbox" sem permissão de janelas (acontece em alguns jeitos de
// incorporar o site em outra página) — e aí o botão Excluir parecia não fazer
// nada. Assim funciona em qualquer lugar e ainda acompanha o tema claro/escuro.
function confirmar(mensagem, rotulo) {
  return new Promise(resolve => {
    const anterior = document.activeElement;
    const raiz = document.createElement('div');
    raiz.className = 'confirm-backdrop';
    raiz.innerHTML = `<div class="confirm-box" role="alertdialog" aria-modal="true" aria-label="${esc(mensagem)}">
      <p>${esc(mensagem)}</p>
      <div class="confirm-acoes">
        <button type="button" class="btn" data-confirm="nao">Cancelar</button>
        <button type="button" class="btn danger" data-confirm="sim">${esc(rotulo || 'Excluir')}</button>
      </div></div>`;
    const teclas = e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); fechar(false); } };
    const fechar = r => {
      document.removeEventListener('keydown', teclas, true);
      raiz.remove();
      if (anterior && anterior.focus) anterior.focus();
      resolve(r);
    };
    raiz.addEventListener('click', e => {
      const alvo = e.target.closest('[data-confirm]');
      if (alvo) fechar(alvo.dataset.confirm === 'sim');
      else if (e.target === raiz) fechar(false);
    });
    document.addEventListener('keydown', teclas, true);
    document.body.appendChild(raiz);
    raiz.querySelector('[data-confirm="nao"]').focus(); // o foco começa em "Cancelar": Enter sem querer não exclui nada
  });
}

// Janelinha de ajuda (texto explicativo), aberta pelo botão "?" — mesma
// técnica da confirmar(), só que sem escolha: um botão só, pra fechar.
function mostrarAjuda(titulo, corpoHTML) {
  const anterior = document.activeElement;
  const raiz = document.createElement('div');
  raiz.className = 'confirm-backdrop';
  raiz.innerHTML = `<div class="confirm-box ajuda-box" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <h3>${esc(titulo)}</h3>
    ${corpoHTML}
    <div class="confirm-acoes"><button type="button" class="btn" data-fechar-ajuda>Entendi</button></div>
  </div>`;
  const teclas = e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); fechar(); } };
  const fechar = () => {
    document.removeEventListener('keydown', teclas, true);
    raiz.remove();
    if (anterior && anterior.focus) anterior.focus();
  };
  raiz.addEventListener('click', e => {
    if (e.target.closest('[data-fechar-ajuda]') || e.target === raiz) fechar();
  });
  document.addEventListener('keydown', teclas, true);
  document.body.appendChild(raiz);
  raiz.querySelector('[data-fechar-ajuda]').focus();
}

/* =====================================================================
   COORDENADOR DA TUTORIA
   Painel que QUALQUER discente da turma pode abrir dentro de um evento do
   tipo Tutoria: define os objetivos/subobjetivos (uma vez, no início),
   cronometra a fala e conta as intervenções de cada colega (tudo local, no
   navegador de quem está mediando — é por isso que o site pede "um
   mediador por vez": não há sincronização em tempo real entre aparelhos) e,
   ao final, envia pro servidor só o relatório — que trava a sessão pra
   sempre e passa a mostrar, pra cada discente que reabrir o evento, só o
   PRÓPRIO tempo de fala e as próprias intervenções.
   ===================================================================== */
let coord = null;

// Nomes da lista do evento, na ordem em que aparecem (ignora linhas de
// título como "Subgrupo A:" — mesma regra de estouNesseEvento).
function rosterDoEvento(e) {
  const nomes = [];
  String(e.discentes || '').split('\n').forEach(linha => {
    const m = linha.match(/^\s*\d+\s*\|\s*(.+?)\s*$/);
    if (m && m[1].trim()) nomes.push(m[1].trim());
  });
  return nomes.filter((n, i) => nomes.indexOf(n) === i);
}

// Atalho de teclado automático: a primeira letra do primeiro nome; quem
// repetir a letra com um colega ganha um número atrás, só pra identificar
// visualmente (o atalho em si continua sendo "a primeira letra que achar
// alguém disponível", igual ao arquivo original que a turma mandou).
function coordAtribuirAtalhos() {
  const contagemBase = {};
  coord.alunos.forEach(a => {
    const letra = ((tokensDeNome(a.nome)[0] || a.nome || '?').charAt(0) || '?').toUpperCase();
    a._letraBase = letra;
    contagemBase[letra] = (contagemBase[letra] || 0) + 1;
  });
  const vistos = {};
  coord.alunos.forEach(a => {
    vistos[a._letraBase] = (vistos[a._letraBase] || 0) + 1;
    a.atalho = contagemBase[a._letraBase] > 1 ? a._letraBase + vistos[a._letraBase] : a._letraBase;
  });
}

async function abrirCoordenador(eventoId) {
  const e = state.events.find(x => x.id === eventoId);
  if (!e) return;
  const roster = rosterDoEvento(e);
  if (!roster.length) { toast('Este evento não tem discentes cadastrados na lista.', 'err'); return; }
  coord = {
    eventoId, evento: e, fase: 'carregando', editando: false,
    objetivos: null, topicoAtual: null, rascunho: [{ titulo: '', subs: [''] }],
    alunos: roster.map(nome => ({ nome, seg: 0, turns: 0, active: false })),
    activeIdx: null, _timer: null, status: 'aberta', iniciadoPor: '', meuRelatorio: null, erro: '',
  };
  coordAtribuirAtalhos();
  openModal(coordModalHTML(), 'coord', 'coord');
  try {
    const r = await Backend.tutoriaSessao(state.session.usuario, eventoId);
    coord.status = r.status || 'aberta';
    coord.iniciadoPor = r.iniciadoPor || '';
    coord.meuRelatorio = r.meuRelatorio || null;
    if (coord.status === 'encerrada') {
      coord.objetivos = r.objetivos || [];
      coord.fase = 'encerrada';
    } else if (r.objetivos && r.objetivos.length) {
      coord.objetivos = r.objetivos;
      coord.topicoAtual = r.objetivos[0].titulo;
      coord.fase = 'sessao';
    } else {
      coord.fase = 'objetivos';
    }
  } catch (err) {
    coord.fase = 'erro';
    coord.erro = err.message || 'Não foi possível carregar a sessão.';
  }
  reRenderCoordenador();
}

function reRenderCoordenador() {
  if (!coord || state.modal !== 'coord') return;
  const modalEl = document.querySelector('#modal-root .modal');

// cronômetro continua rodando normalmente por trás).
function iniciarEdicaoObjetivos() {

async function salvarEdicaoObjetivos() {
  const objetivos = validarRascunhoObjetivos();

    await Backend.salvarObjetivosTutoria(state.session.usuario, coord.eventoId, objetivos);

/* ---- Fase 2: sessão ao vivo (cronômetro + intervenções) ---- */
// Lista "achatada" (objetivo + subobjetivos, na ordem) — usada tanto pra
// navegar com as setas do teclado quanto pro contador "2 de 5".
function coordTopicosFlat() {
  const out = [];
  (coord.objetivos || []).forEach(o => {
    out.push({ titulo: o.titulo, nivel: 0 });
    (o.subs || []).forEach(s => out.push({ titulo: s, nivel: 1 }));
  });
  return out;
}

function coordNavegarTopico(delta) {
  if (!coord || coord.fase !== 'sessao' || coord.editando) return;
  const itens = coordTopicosFlat();
  if (!itens.length) return;
  let idx = itens.findIndex(it => it.titulo === coord.topicoAtual);
  if (idx < 0) idx = 0;
  idx = (idx + delta + itens.length) % itens.length;
  coord.topicoAtual = itens[idx].titulo;
  atualizarObjView();
}

// Só repinta a coluna de objetivos (mantém o resto do painel, inclusive o
// cronômetro, intacto).
function atualizarObjView() {
  const box = document.getElementById('coord-obj-view');
  if (box) box.innerHTML = coordObjetivosViewHTML();
  const nav = document.getElementById('coord-nav-count');
  if (nav) {
    const itens = coordTopicosFlat();
    const idx = Math.max(0, itens.findIndex(it => it.titulo === coord.topicoAtual));
    nav.textContent = (itens.length ? idx + 1 : 0) + ' de ' + itens.length;
  }
}

function coordObjetivosViewHTML() {
  return coordTopicosFlat().map(it => {
    const ativo = coord.topicoAtual === it.titulo;
    return `<div class="coord-obj-node ${it.nivel ? 'lvl1' : ''} ${ativo ? 'active' : ''}" data-action="coord-selecionar-topico" data-id="${esc(it.titulo)}">
      <div class="coord-obj-row">${ativo ? icon('check', 13) : `<span style="width:13px;display:inline-block;flex:none"></span>`}<span>${esc(it.titulo)}</span></div>
    </div>`;
  }).join('');
}

function coordAlunosOrdenados() {
  return coord.alunos.map((a, idx) => Object.assign({ _idx: idx }, a)).sort((a, b) => a.seg - b.seg);

function coordToggleFala(idxRaw) {
  const idx = Number(idxRaw);
  const a = coord.alunos[idx];
  if (!a) return;
  if (a.active) {
    a.active = false;
    coord.activeIdx = null;
    pararCronometroCoordenador();
  } else {
    coord.alunos.forEach(x => x.active = false);
    a.active = true;
    a.turns += 1;
    coord.activeIdx = idx;
    pararCronometroCoordenador();
    coord._timer = setInterval(() => { a.seg += 1; coordAtualizarContadores(); }, 1000);
  }
  reRenderCoordenador();
}

// Atualização de 1 em 1 segundo — só o chip "falando agora" e a lista de
// discentes, sem re-renderizar o painel inteiro (evita perder o scroll).
function coordAtualizarContadores() {
  if (!coord) return;
  const chip = document.getElementById('coord-live-chip');
  const a = coord.activeIdx != null ? coord.alunos[coord.activeIdx] : null;
  if (chip) {
    if (a) {
      chip.classList.add('show');
      const nomeEl = document.getElementById('coord-live-name'); if (nomeEl) nomeEl.textContent = tokensDeNome(a.nome)[0] ? a.nome.split(' ')[0] : a.nome;
      const tempoEl = document.getElementById('coord-live-time'); if (tempoEl) tempoEl.textContent = fmtTempoCoord(a.seg);
    } else {
      chip.classList.remove('show');
    }
  }
  const box = document.getElementById('coord-students');
  if (box) box.innerHTML = coordStudentsHTML();
}

async function confirmarEncerrarCoordenador() {
  if (!(await confirmar('Encerrar a sessão e enviar o relatório final? Depois disso não será mais possível editar, e cada discente só vai ver o próprio tempo de fala.', 'Enviar relatório'))) return;
  pararCronometroCoordenador();
  coord.alunos.forEach(a => a.active = false);
  coord.activeIdx = null;
  const relatorio = {};
  coord.alunos.forEach(a => { relatorio[a.nome] = { tempoSeg: a.seg, intervencoes: a.turns }; });
  try {
    await Backend.encerrarSessaoTutoria(state.session.usuario, coord.eventoId, relatorio);
    coord.fase = 'encerrada';
    const meuAluno = coord.alunos.find(a => mesmoNome(tokensDeNome(a.nome), tokensDeNome(state.session.nome || state.session.usuario)));
    coord.meuRelatorio = meuAluno ? relatorio[meuAluno.nome] : null;
    reRenderCoordenador();
    toast('Relatório enviado.');
  } catch (err) {
    if (!handleApiError(err)) toast(err.message || 'Não foi possível enviar o relatório.', 'err');
  }
}

// Atalhos de teclado da sessão ao vivo: a letra do nome dá voz a quem ainda
// não está falando; Enter pausa quem está com a palavra agora; ←/→ navegam
// entre os objetivos. Só funciona com o painel aberto, fora de campos de
// texto e fora do modo de edição dos objetivos.
document.addEventListener('keydown', ev => {
  if (!coord || coord.fase !== 'sessao' || state.modal !== 'coord' || coord.editando) return;
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return;
  if (ev.key === 'ArrowLeft') { ev.preventDefault(); coordNavegarTopico(-1); return; }
  if (ev.key === 'ArrowRight') { ev.preventDefault(); coordNavegarTopico(1); return; }
  const key = ev.key.toLowerCase();
  if (key === 'enter') { if (coord.activeIdx != null) coordToggleFala(coord.activeIdx); return; }
  const idx = coord.alunos.findIndex(a => !a.active && String(a.atalho || '').toLowerCase().charAt(0) === key);
  if (idx >= 0) coordToggleFala(idx);
});

/* ---------- formulário do presidente ---------- */
const optHTML = (val, label, sel) => `<option value="${esc(val)}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;

// Opções de grupo conforme a disciplina: Tutoria usa T1/T2; as demais, subgrupos e divisões.
// keepExtra: ao editar, mantém o grupo já salvo mesmo que não esteja na lista.
function groupSelectHTML(disc, current, keepExtra) {
  const groups = groupOptionsFor(disc).map(g => ({ label: g.label, items: g.items.slice() }));
  const listed = groups.some(g => g.items.indexOf(current) >= 0);
  if (keepExtra && current && !listed && groupBlocks(current, disc).length) groups.push({ label: 'Grupo atual do evento', items: [current] });
  const sel = listed || (keepExtra && current) ? current : groups[0].items[0];
  return groups.map(g => `<optgroup label="${esc(g.label)}">${g.items.map(k => optHTML(k, `${grupoLabel(k)} (${groupCount(k, disc)} discentes)`, k === sel)).join('')}</optgroup>`).join('');
}

  if ($('#f-disciplina').value !== DISC_TUTORIA) return;
  const g = $('#f-grupo').value, dc = $('#f-docente');

  const doOutro = Object.keys(CONFIG.TUTORES).some(k => k !== g && CONFIG.TUTORES[k] && CONFIG.TUTORES[k] === dc.value.trim());

function syncFormFields() {

  $('#w-tutoria').hidden = disc !== DISC_TUTORIA;
  $('#l-docente').textContent = disc === DISC_TUTORIA ? 'Tutor(a)' : 'Docente';
  $('#q-pneumo').hidden = !(disc === DISC_HAB && $('#f-eixo').value === 'Pneumologia');
}

function onFormChange(t) {
  if (t.id === 'f-disciplina') {
    syncFormFields();
    const form = t.form, grp = $('#f-grupo'), txt = $('#f-discentes');
    const antes = grp.value, discAntes = form.dataset.disc || '';
    const intacto = txt.value.trim() === discentesText(antes, discAntes).trim();
    grp.innerHTML = groupSelectHTML(t.value, antes, false);
    if (intacto || grp.value !== antes) txt.value = discentesText(grp.value, t.value);
    form.dataset.disc = t.value;
    // A lista de docentes sugeridos (datalist) muda conforme a disciplina.
    $('#dl-docentes').innerHTML = docentesFor(t.value).map(x => `<option value="${esc(x)}">`).join('');
    const dc = $('#f-docente');
    if (t.value === DISC_MORFO && !dc.value.trim()) { dc.value = suggestMorfoDocente($('#f-data').value); setDocenteHint('Sugerido pelo rodízio entre os docentes de Morfofuncional. Pode alterar.'); }
    else setDocenteHint('');
    suggestTutor();
  } else if (t.id === 'f-eixo') {
    syncFormFields();
  } else if (t.id === 'f-grupo') {
    $('#f-discentes').value = discentesText(t.value, $('#f-disciplina').value);
    suggestTutor();
  } else if (t.id === 'f-local-rapido') {
    if (t.value) $('#f-local').value = t.value;
  }
}

async function submitForm(form) {
  const ev = Object.fromEntries(new FormData(form).entries());
  ev.arquivosAnexados = formAnexos.map(a => a.id);
  const errs = [];
  if (!ev.titulo.trim()) errs.push('Informe o título.');
  if (!ev.data) errs.push('Escolha o dia.');
  if (!ev.inicio || !ev.fim) errs.push('Informe os horários de início e de fim.');
  else if (toMin(ev.fim) <= toMin(ev.inicio)) errs.push('O horário de fim deve ser depois do início.');
  if (ev.disciplina === DISC_HAB && !ev.eixo) errs.push('Escolha o eixo de Habilidades Profissionais.');
  const errEl = $('#f-err');
  if (errs.length) { errEl.textContent = errs.join(' '); errEl.hidden = false; return; }
  errEl.hidden = true;
  if (ev.disciplina !== DISC_HAB) ev.eixo = '';
  if (ev.disciplina !== DISC_TUTORIA) ev.tutoriaTipo = '';
  ev.titulo = ev.titulo.trim();

  const btn = form.querySelector('[data-action="submit-event-form"]');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    const r = await Backend.saveEvent(state.session.token, ev);
    const saved = norm(r.event);
    const i = state.events.findIndex(x => x.id === saved.id);
    if (i >= 0) state.events[i] = saved; else state.events.push(saved);
    state.version = r.version;
    saveCache();
    closeModal();
    const d = parseISO(saved.data);
    if (state.view === 'mes' ? (d.getMonth() !== state.cursor.getMonth() || d.getFullYear() !== state.cursor.getFullYear()) : iso(mondayOf(d)) !== iso(mondayOf(state.cursor))) state.cursor = d;
    state.tab = 'cronograma';
    renderView();
    toast('Evento salvo e enviado aos discentes.');
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    if (handleApiError(e)) return;
    errEl.textContent = e.message || 'Não foi possível salvar.'; errEl.hidden = false;
  }
}

async function removeEvent(id) {
  if (!(await confirmar('Excluir este evento? Ele sai do cronograma de todos os discentes.'))) return;
  try {
    const r = await Backend.deleteEvent(state.session.token, id);
    state.events = state.events.filter(e => e.id !== id);
    state.followed.delete(id);
    if (r.version) state.version = r.version;
    saveCache();
    closeModal();
    renderView();
    toast('Evento excluído.');
  } catch (e) {
    if (!handleApiError(e)) toast(e.message || 'Não foi possível excluir.', 'err');
  }
}

  };
  const errs = [];

async function removeArquivo(id) {

  try {
    const r = await Backend.deleteArquivo(state.session.token, id);
    state.arquivos = state.arquivos.filter(a => a.id !== id);
    if (r.versionArq) state.versionArq = r.versionArq;
    saveCache();
    renderView();
    toast('Arquivo excluído.');
  } catch (e) {
    if (!handleApiError(e)) toast(e.message || 'Não foi possível excluir.', 'err');
  }
}

async function moverArquivo(id, direcao) {
  const item = state.arquivos.find(a => a.id === id);
  if (!item) return;
  const doGrupo = state.arquivos.filter(a => a.disciplina === item.disciplina).sort((x, y) => Number(x.ordem || 0) - Number(y.ordem || 0));
  const i = doGrupo.findIndex(a => a.id === id);
  const j = direcao === 'down' ? i + 1 : i - 1;
  if (i < 0 || j < 0 || j >= doGrupo.length) return;
  [doGrupo[i], doGrupo[j]] = [doGrupo[j], doGrupo[i]];
  doGrupo.forEach((a, idx) => { a.ordem = String(idx); });
  saveCache();
  renderView();
  try {
    const r = await Backend.reordenarArquivos(state.session.token, doGrupo.map(a => a.id));
    if (r.versionArq) state.versionArq = r.versionArq;
  } catch (e) {
    if (!handleApiError(e)) { toast(e.message || 'Não foi possível salvar a nova ordem.', 'err'); await sync({ force: true }); }
  }
}
