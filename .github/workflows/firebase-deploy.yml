name: Publicar Cloud Functions e regras no Firebase

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências das Cloud Functions
        run: npm --prefix functions install

      - name: Gravar a credencial do Firebase (temporária, só nesta execução)
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-key.json"

      - name: Publicar Functions + Regras do Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: npx firebase-tools@13 deploy --only functions,firestore:rules --project turma23b --non-interactive

      - name: Apagar a credencial temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
